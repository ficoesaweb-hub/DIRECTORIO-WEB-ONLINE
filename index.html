<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FICOESA Creative Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: barra lateral fija con los tres módulos de consulta y la administración. Una sola fuente de datos (db) alimenta calendario, directorio, fichas y panel. Identidad: Montserrat, antracita, #FDC506 y #EBFF00. */
  :root {
    --color-primary: #fdc506;
    --color-accent: #ebff00;
    --color-white: #ffffff;
    --color-anthracite: #252525; /* valor provisional hasta confirmar el antracita corporativo */
    --font-primary: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;

    --bg: var(--color-anthracite);
    --text: var(--color-white);
    --surface-1: color-mix(in srgb, var(--color-white) 5%, var(--color-anthracite));
    --surface-2: color-mix(in srgb, var(--color-white) 10%, var(--color-anthracite));
    --surface-3: color-mix(in srgb, var(--color-white) 16%, var(--color-anthracite));
    --line: color-mix(in srgb, var(--color-white) 18%, var(--color-anthracite));
    --muted: color-mix(in srgb, var(--color-white) 68%, var(--color-anthracite));
    --on-primary: var(--color-anthracite);
    --lv1: color-mix(in srgb, var(--color-primary) 9%, var(--color-anthracite));
    --lv2: color-mix(in srgb, var(--color-primary) 19%, var(--color-anthracite));
    --lv3: color-mix(in srgb, var(--color-primary) 32%, var(--color-anthracite));
    --sidebar-w: 252px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-primary); font-size: 15px; line-height: 1.5; font-weight: 400; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
  button:disabled { cursor: default; }
  img { display: block; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  .ic { flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }

  .sidebar { position: sticky; top: 0; align-self: start; height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 28px; padding: 28px 20px 24px; background: var(--surface-1); border-right: 1px solid var(--line); z-index: 30; overflow-y: auto; }
  .wordmark { display: grid; gap: 2px; padding-inline: 8px; }
  .wordmark b { font-weight: 800; font-size: 1.55rem; letter-spacing: 0.04em; line-height: 1; }
  .wordmark span { font-weight: 600; font-size: 0.68rem; letter-spacing: 0.22em; color: var(--color-primary); }
  .nav { display: grid; gap: 4px; }
  .nav-i { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px 11px 14px; font-weight: 500; font-size: 0.9rem; color: var(--muted); border-left: 3px solid transparent; transition: background-color .15s, color .15s; }
  .nav-i:hover { background: var(--surface-2); color: var(--text); }
  .nav-i[aria-current="page"] { color: var(--color-primary); border-left-color: var(--color-primary); background: var(--surface-2); font-weight: 600; }
  .nav-i small { margin-left: auto; font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
  .nav-sep { height: 1px; background: var(--line); margin: 10px 0; }
  .side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--line); font-size: 0.72rem; color: var(--muted); line-height: 1.5; }
  .scrim { display: none; }

  .content { min-width: 0; padding-inline: clamp(16px, 3.2vw, 44px); padding-block: 0 72px; }
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px; padding-block: 14px; margin-inline: calc(-1 * clamp(16px, 3.2vw, 44px)); padding-inline: clamp(16px, 3.2vw, 44px); background: color-mix(in srgb, var(--color-anthracite) 94%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(8px); }
  .menu-btn { display: none; width: 40px; height: 40px; place-items: center; border: 1px solid var(--line); }
  .pagename { font-weight: 600; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  .search { margin-left: auto; position: relative; flex: 0 1 380px; min-width: 0; }
  .search input { width: 100%; height: 40px; padding: 0 12px 0 40px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; }
  .search input::placeholder { color: var(--muted); }
  .search .ic { position: absolute; left: 12px; top: 10px; color: var(--muted); pointer-events: none; }
  .demo-flag { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent); }
  .demo-flag::before { content: ""; width: 7px; height: 7px; background: var(--color-accent); }

  main { padding-top: 40px; outline: none; }
  .eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-primary); }
  .page-h { display: grid; gap: 10px; margin-bottom: 28px; }
  .page-h h1 { font-weight: 700; font-size: clamp(1.7rem, 3.4vw, 2.5rem); line-height: 1.1; letter-spacing: -0.01em; text-wrap: balance; }
  .page-h p { color: var(--muted); max-width: 64ch; }

  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 18px; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.02em; border: 1px solid var(--line); border-radius: 2px; transition: background-color .15s, border-color .15s; }
  .btn:hover:not(:disabled) { border-color: var(--text); }
  .btn:disabled { opacity: .5; }
  .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: var(--on-primary); }
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--color-primary) 88%, white); border-color: var(--color-primary); }
  .btn.icon-only { width: 40px; padding: 0; justify-content: center; }
  .btn.sm { min-height: 32px; padding: 4px 10px; font-size: 0.74rem; gap: 6px; }
  .btn.danger { border-color: var(--color-accent); color: var(--color-accent); }
  .btn[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--on-primary); }

  .sel { display: grid; gap: 4px; min-width: 0; }
  .sel label { font-size: 0.65rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .sel select, .sel input { height: 38px; padding: 0 10px; min-width: 0; width: 100%; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; }
  select option { background: var(--color-anthracite); color: var(--color-white); }

  .c-worko { color: var(--color-primary); } .c-forli { color: var(--color-white); }
  .c-otros { color: var(--muted); } .c-festivos { color: var(--color-accent); }
  .cm, .sm { flex: none; display: inline-block; vertical-align: -1px; margin-right: 6px; }
  .tag { display: inline-flex; align-items: center; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .status { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }

  /* Inicio */
  .hero { display: grid; gap: 14px; padding-block: 24px 44px; }
  .hero-t { font-weight: 800; font-size: clamp(2.5rem, 7.4vw, 5.6rem); line-height: 0.98; letter-spacing: -0.02em; text-wrap: balance; }
  .hero-t em { font-style: normal; color: var(--color-primary); }
  .hero-s { font-size: clamp(1.05rem, 1.8vw, 1.35rem); font-weight: 500; }
  .hero-d { color: var(--muted); max-width: 58ch; }
  .access { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
  .acc { position: relative; display: grid; align-content: start; gap: 14px; min-height: 260px; padding: 26px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; transition: border-color .2s, background-color .2s, transform .2s; }
  .acc:hover { border-color: var(--color-primary); background: var(--surface-2); transform: translateY(-2px); }
  .acc-n { font-weight: 800; font-size: 0.8rem; letter-spacing: 0.12em; color: var(--color-primary); }
  .acc-t { font-weight: 800; font-size: 1.5rem; letter-spacing: 0.02em; }
  .acc-d { color: var(--muted); font-size: 0.9rem; max-width: 34ch; }
  .acc-go { margin-top: auto; display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary); }
  .soon-pill { position: absolute; top: 22px; right: 22px; padding: 4px 9px; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-primary); background: var(--color-accent); }

  .sec { margin-top: 56px; }
  .sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .sec-h h2 { font-weight: 700; font-size: 1.25rem; letter-spacing: 0.01em; }
  .link { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-primary); display: inline-flex; align-items: center; gap: 8px; }
  .link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .empty { padding: 28px; border: 1px dashed var(--line); color: var(--muted); display: grid; gap: 12px; justify-items: start; }
  .empty b { color: var(--text); font-weight: 700; }

  .brand-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
  .brand-tile { display: grid; gap: 10px; align-content: space-between; min-height: 170px; padding: 24px; border-radius: 2px; border: 1px solid var(--line); transition: transform .2s; }
  .brand-tile b { font-weight: 800; font-size: 2.2rem; letter-spacing: 0.02em; line-height: 1; }
  .brand-tile span { font-size: 0.85rem; }
  .brand-tile.worko { background: var(--color-primary); color: var(--on-primary); border-color: var(--color-primary); }
  .brand-tile.forli { background: var(--color-white); color: var(--color-anthracite); border-color: var(--color-white); }
  .brand-tile:hover { transform: translateY(-2px); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .stat { display: grid; gap: 4px; padding: 22px; background: var(--bg); }
  .stat b { font-weight: 800; font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.75rem; color: var(--muted); font-weight: 500; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 24px 20px; }
  .grid.sm { grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 20px 16px; }
  .pcard { display: block; min-width: 0; }
  .pc-img { position: relative; display: block; aspect-ratio: 4 / 5; overflow: hidden; background: var(--surface-1); }
  .pc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
  .pcard:hover .pc-img img { transform: scale(1.025); }
  .pc-n, .pc-st { position: absolute; padding: 3px 8px; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em; background: var(--color-anthracite); color: var(--color-white); }
  .pc-n { right: 8px; bottom: 8px; } .pc-st { left: 8px; top: 8px; text-transform: uppercase; border: 1px dashed var(--color-primary); }
  .pc-b { display: grid; gap: 4px; padding-top: 12px; }
  .pc-t { font-weight: 600; font-size: 0.95rem; line-height: 1.3; text-wrap: balance; }
  .pcard:hover .pc-t { color: var(--color-primary); }
  .pc-m { font-size: 0.75rem; color: var(--muted); }

  .list { display: grid; border-top: 1px solid var(--line); }
  .lr, .lh { display: grid; grid-template-columns: 52px 112px minmax(0, 2.2fr) minmax(0, 1.5fr) 118px 112px 70px 112px; gap: 16px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
  .lh { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding-block: 12px; }
  .lr { width: 100%; font-size: 0.85rem; }
  .lr:hover { background: var(--surface-1); }
  .lr > * { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .lr img { width: 40px; height: 50px; object-fit: cover; }
  .lr .ref { font-weight: 600; font-size: 0.78rem; letter-spacing: 0.04em; color: var(--muted); }
  .lr .ttl { font-weight: 600; }
  .list-wrap { overflow-x: auto; }
  .list-inner { min-width: 860px; }

  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-bottom: 20px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
  .crumbs button { color: var(--muted); padding: 4px 0; }
  .crumbs button:hover { color: var(--color-primary); }
  .crumbs .sep { color: var(--line); }
  .crumbs .cur { color: var(--text); padding: 4px 0; overflow-wrap: anywhere; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: end; gap: 14px 16px; margin-bottom: 28px; }
  .toolbar .sel { min-width: 170px; }
  .toolbar .grow { margin-left: auto; display: flex; gap: 8px; }
  .check { display: inline-flex; align-items: center; gap: 10px; min-height: 38px; font-size: 0.82rem; color: var(--muted); }
  .check input { width: 18px; height: 18px; accent-color: var(--color-primary); }

  .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 20px; }
  .year-card { display: grid; gap: 18px; padding: 24px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; transition: border-color .2s; }
  .year-card:hover { border-color: var(--color-primary); }
  .year-card .yr { font-weight: 800; font-size: clamp(3rem, 7vw, 4.6rem); line-height: 1; letter-spacing: -0.02em; }
  .year-card .yn { color: var(--muted); font-size: 0.85rem; }
  .mosaic { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .mosaic img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .mosaic .ph { aspect-ratio: 4 / 5; background: var(--surface-2); }

  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
  .cat-card { display: grid; gap: 18px; align-content: space-between; min-height: 280px; padding: 24px; border: 1px solid var(--line); border-radius: 2px; transition: transform .2s; }
  .cat-card:hover:not([disabled]) { transform: translateY(-2px); }
  .cat-card[disabled] { opacity: .45; cursor: default; }
  .cat-card b { display: block; font-weight: 800; font-size: 1.9rem; line-height: 1.05; letter-spacing: 0.01em; }
  .cat-card .cn { font-size: 0.85rem; font-weight: 500; }
  .cat-card .mosaic { grid-template-columns: repeat(3, 1fr); }
  .cat-card.worko { background: var(--color-primary); border-color: var(--color-primary); color: var(--on-primary); }
  .cat-card.forli { background: var(--color-white); border-color: var(--color-white); color: var(--color-anthracite); }
  .cat-card.otros { background: var(--surface-1); }
  .cat-card.festivos { background: var(--surface-1); border-top: 4px solid var(--color-accent); }
  .cat-glyph { margin-bottom: 14px; }

  .month-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 12px; }
  .month-card { display: grid; gap: 6px; padding: 20px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; }
  .month-card:hover:not([disabled]) { border-color: var(--color-primary); }
  .month-card b { font-weight: 700; font-size: 1.1rem; text-transform: capitalize; }
  .month-card span { font-size: 0.78rem; color: var(--muted); }
  .month-card[disabled] { opacity: .4; cursor: default; }

  .camp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 20px; }
  .camp-card { display: grid; gap: 14px; padding: 20px; background: var(--surface-1); border: 1px solid var(--line); border-radius: 2px; }
  .camp-card:hover { border-color: var(--color-primary); }
  .camp-card b { font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
  .camp-card .mosaic { grid-template-columns: repeat(3, 1fr); }

  /* Calendario */
  .cal-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 18px; }
  .cal-title { font-weight: 800; font-size: clamp(1.5rem, 3vw, 2.2rem); letter-spacing: -0.01em; text-transform: capitalize; margin-right: auto; }
  .years { display: flex; gap: 8px; flex-wrap: wrap; }
  .months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; margin-bottom: 20px; }
  .mtab { display: grid; gap: 2px; padding: 8px 4px; text-align: center; border: 1px solid var(--line); font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .mtab small { font-size: 0.65rem; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .mtab:hover { border-color: var(--text); }
  .mtab[aria-pressed="true"] { background: var(--color-primary); border-color: var(--color-primary); color: var(--on-primary); }
  .mtab[aria-pressed="true"] small { color: var(--on-primary); }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; margin-bottom: 22px; }
  .cal-head, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-head span { padding: 8px 10px; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .cal-grid { gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .cell { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 168px; padding: 8px; background: var(--bg); text-align: left; }
  .cell.off { background: color-mix(in srgb, var(--color-anthracite) 70%, black); }
  .cell.lv1 { background: var(--lv1); } .cell.lv2 { background: var(--lv2); } .cell.lv3 { background: var(--lv3); }
  .cell.has { cursor: pointer; }
  .cell-h { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .dnum { font-weight: 600; font-size: 0.85rem; padding-bottom: 2px; border-bottom: 2px solid transparent; }
  .cell.today .dnum { border-bottom-color: var(--color-white); }
  .dens { display: inline-flex; align-items: center; gap: 6px; font-size: 0.68rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .bars i { width: 3px; background: var(--line); }
  .bars i:nth-child(1) { height: 4px; } .bars i:nth-child(2) { height: 7px; } .bars i:nth-child(3) { height: 10px; }
  .bars i.on { background: var(--color-primary); }
  .evs { display: grid; gap: 4px; min-width: 0; }
  .ev { display: flex; align-items: flex-start; gap: 6px; min-width: 0; width: 100%; padding: 4px; background: var(--color-anthracite); border: 1px solid var(--line); border-left-width: 3px; border-radius: 1px; }
  .ev:hover { border-color: var(--color-primary); }
  .ev.k-worko { border-left-color: var(--color-primary); } .ev.k-forli { border-left-color: var(--color-white); }
  .ev.k-otros { border-left-color: var(--muted); } .ev.k-festivos { border-left-color: var(--color-accent); }
  .ev.st-pendiente { border-style: dashed; border-left-style: solid; border-color: var(--color-primary); border-left-color: inherit; }
  .ev.st-pendiente.k-forli { border-left-color: var(--color-white); } .ev.st-pendiente.k-worko { border-left-color: var(--color-primary); }
  .ev.st-pendiente.k-otros { border-left-color: var(--muted); } .ev.st-pendiente.k-festivos { border-left-color: var(--color-accent); }
  .ev img { width: 22px; height: 28px; object-fit: cover; flex: none; }
  .ev-tx { display: grid; min-width: 0; line-height: 1.3; }
  .ev-t { font-size: 0.68rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev-m { font-size: 0.58rem; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.03em; }
  .ev-s { font-size: 0.58rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  .ev.st-publicada .ev-s { color: var(--text); } .ev.st-pendiente .ev-s { color: var(--color-primary); }
  .more { font-size: 0.7rem; font-weight: 700; color: var(--color-primary); padding: 2px 2px; text-align: left; }
  .more:hover { text-decoration: underline; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 14px; font-size: 0.74rem; color: var(--muted); }

<script>
(function () {

  var STATUS = { publicada: 'Publicada', pendiente: 'Pendiente', archivada: 'Archivada' };

      if (query) { if (route.name !== 'buscar') { searchFrom = { name: route.name, id: route.id }; go('buscar'); } else render(); }
      else if (route.name === 'buscar') { var b = searchFrom && searchFrom.name !== 'buscar' ? searchFrom : { name: 'inicio', id: null }; go(b.name, b.id); }
    }, 160);
  });
  $('search-form').addEventListener('submit', function (e) { e.preventDefault(); query = $('q').value.trim(); if (query) { if (route.name !== 'buscar') { searchFrom = { name: route.name, id: route.id }; go('buscar'); } else render(); } });

  /* ---------- Inicio de sesión y repositorio Supabase ---------- */
  function openLogin() {
    var html = '<div class="ov-bg" data-act="close-overlay"></div><div class="modal" role="dialog" aria-modal="true" aria-label="Acceso administrador">' +
      '<h2>Acceso de administrador</h2><p class="note">Cuenta autorizada: ficoesaweb@gmail.com</p>' +
      '<form id="auth-form" class="form" style="gap:12px"><div class="field"><label for="auth-email">Correo electrónico</label><input class="in" id="auth-email" type="email" autocomplete="username" value="ficoesaweb@gmail.com" required></div>' +
      '<div class="field"><label for="auth-pass">Contraseña</label><input class="in" id="auth-pass" type="password" autocomplete="current-password" required></div>' +
      '<p id="auth-error" class="err" aria-live="polite"></p><button type="submit" class="btn primary">Iniciar sesión</button>' +
      '<button type="button" class="btn" data-act="close-overlay">Cancelar</button></form>' +
      '<p class="note">La cuenta debe existir en Supabase Authentication y estar autorizada como admin mediante SQL.</p></div>';
    openOverlay(html, 'auth-email');
  }
  async function submitLogin() {
    var box = $('auth-error'), email = $('auth-email').value.trim(), pwd = $('auth-pass').value;
    box.textContent = 'Comprobando credenciales…';
    try {
      await window.FICOESA_BACKEND.signIn(email, pwd);
      var role = await window.FICOESA_BACKEND.role();
      if (role !== 'admin') { await window.FICOESA_BACKEND.signOut(); throw new Error('Cuenta válida, pero sin permisos de administrador. Ejecuta el SQL de asignación de rol.'); }
      authState = 'admin'; ASSETS = window.FICOESA_BACKEND.assets; MYID = (await window.FICOESA_BACKEND.getUser()).id;
      closeOverlay(); render(); toast('Acceso de administrador activado');
    } catch(e) { box.textContent = errText(e); }
  }
  document.addEventListener('submit', function (e) { if (e.target.id === 'auth-form') { e.preventDefault(); submitLogin(); } });
  async function startBackend() {
    var backend = window.FICOESA_BACKEND;
    if (!backend || !backend.configured) { dbState = 'nodb'; authState = 'viewer'; render(); return; }
    DB = backend.db;
    try {
      authState = await backend.role();
      if (authState === 'admin') { ASSETS = backend.assets; var u = await backend.getUser(); MYID = u ? u.id : null; }
    } catch(e) { console.warn('Error comprobando permisos', e); authState = 'viewer'; }
    DB.collection('campaigns').onSnapshot(function (snap) {
      CAMPAIGNS = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
      dbState = 'ready'; onData();
    }, function (e) { console.error(e); dbState = 'error'; render(); });
    backend.client.auth.onAuthStateChange(function (event) {
      if (event === 'SIGNED_OUT') { authState = 'viewer'; ASSETS = null; MYID = null; render(); }
    });
    render();
  }

  $('menu-btn').innerHTML = ic('menu', 20);
  route = parseHash();
  render();
  startBackend();
})();
</script>
