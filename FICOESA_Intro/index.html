<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FICOESA — Directorio de diseños</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#202222;--yellow:#f6c118;--muted:#b7b8b2;--white:#f8f8f4}
*{box-sizing:border-box}html{min-height:100%;background:var(--ink)}body{margin:0;color:var(--white);font-family:Montserrat,Arial,sans-serif;min-height:100vh}
button,a{font:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--yellow);outline-offset:5px}
.intro{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse 80% 90% at 72% 54%,#323535 0%,#242626 48%,#1d1e1e 100%);display:flex;flex-direction:column}
.intro::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;opacity:.12;background:linear-gradient(90deg,transparent calc(50% - .5px),#deded3 50%,transparent calc(50% + .5px));background-size:25% 100%}
.header{width:100%;padding:clamp(24px,3.7vw,56px) clamp(22px,5.8vw,100px);display:flex;align-items:start;justify-content:space-between;gap:20px;position:relative;z-index:10}
.wordmark{font-size:clamp(19px,2vw,26px);font-weight:800;letter-spacing:-.06em;line-height:1}.wordmark small{display:block;font-size:10px;color:var(--yellow);font-weight:700;letter-spacing:.2em;margin-top:10px}
.brandline{font-size:11px;letter-spacing:.18em;font-weight:700;color:var(--muted);text-align:right;margin-top:4px}
.content{position:relative;z-index:9;flex:1;display:flex;align-items:center;padding:0 clamp(22px,5.8vw,100px) 10vh;pointer-events:none}
.message{width:min(650px,58vw);position:relative;z-index:10}.eyebrow{margin:0 0 23px;color:var(--yellow);font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase}
h1{font-size:clamp(42px,6.5vw,104px);letter-spacing:-.075em;line-height:.99;font-weight:800;margin:0;text-wrap:balance}h1 span{display:block}h1 .yellow{color:var(--yellow)}
.subtitle{margin:27px 0 0;max-width:530px;font-size:clamp(12px,1.24vw,16px);line-height:1.75;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.action-row{margin-top:37px;display:flex;align-items:center;gap:18px;pointer-events:auto;flex-wrap:wrap}
.action{display:inline-flex;justify-content:center;align-items:center;gap:24px;padding:16px 20px;min-height:55px;background:var(--yellow);color:#202222;font-size:12px;font-weight:800;letter-spacing:.05em;text-decoration:none;transition:background-color .25s ease,transform .3s ease}.action:hover{background:#ffe06a;transform:translateY(-2px)}.action svg{width:18px;transition:transform .3s}.action:hover svg{transform:translateX(3px)}
.products{pointer-events:none;position:absolute;inset:0;z-index:4}.product{position:absolute;display:block;object-fit:contain;max-height:76svh;width:clamp(340px,44vw,690px);filter:drop-shadow(0 20px 26px rgba(0,0,0,.21));transform-origin:50% 50%;opacity:0;will-change:transform,opacity}
.p1{top:14%;right:-4%;width:clamp(360px,43vw,670px);animation:arrive1 2.1s cubic-bezier(.2,.76,.2,1) .15s both,drift1 11s ease-in-out 2.25s infinite alternate}
.p2{top:33%;right:19%;width:clamp(350px,39vw,610px);animation:arrive2 2.2s cubic-bezier(.2,.76,.2,1) .4s both,drift2 12s ease-in-out 2.6s infinite alternate}
.p3{top:3%;right:22%;width:clamp(350px,36vw,560px);animation:arrive3 2s cubic-bezier(.2,.76,.2,1) .65s both,drift3 13s ease-in-out 2.65s infinite alternate}
.p4{top:37%;right:-6%;width:clamp(340px,37vw,580px);animation:arrive4 2.1s cubic-bezier(.2,.76,.2,1) .82s both,drift4 10s ease-in-out 2.92s infinite alternate}
/* Las prendas están en PNG RGBA, sin fondos ni modos de fusión. */
@keyframes arrive1{from{opacity:0;transform:translate3d(24px,12px,0) scale(.97) rotate(-4deg)}to{opacity:.79;transform:translate3d(0,0,0) scale(1) rotate(-4deg)}}
@keyframes arrive2{from{opacity:0;transform:translate3d(-18px,18px,0) scale(.97) rotate(2deg)}to{opacity:.76;transform:translate3d(0,0,0) scale(1) rotate(2deg)}}
@keyframes arrive3{from{opacity:0;transform:translate3d(12px,-12px,0) scale(.97) rotate(-3deg)}to{opacity:.52;transform:translate3d(0,0,0) scale(1) rotate(-3deg)}}
@keyframes arrive4{from{opacity:0;transform:translate3d(18px,18px,0) scale(.97) rotate(5deg)}to{opacity:.58;transform:translate3d(0,0,0) scale(1) rotate(5deg)}}
@keyframes drift1{from{transform:translate3d(0,0,0) rotate(-4deg)}to{transform:translate3d(5px,-6px,0) rotate(-3.5deg)}}
@keyframes drift2{from{transform:translate3d(0,0,0) rotate(2deg)}to{transform:translate3d(-5px,5px,0) rotate(1.6deg)}}
@keyframes drift3{from{transform:translate3d(0,0,0) rotate(-3deg)}to{transform:translate3d(3px,5px,0) rotate(-2.6deg)}}
@keyframes drift4{from{transform:translate3d(0,0,0) rotate(5deg)}to{transform:translate3d(-5px,-4px,0) rotate(4.6deg)}}
.message>*{animation:up .95s cubic-bezier(.2,.76,.2,1) both}.message>*:nth-child(1){animation-delay:.25s}.message>*:nth-child(2){animation-delay:.4s}.message>*:nth-child(3){animation-delay:.57s}.message>*:nth-child(4){animation-delay:.75s}
@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.footer{z-index:10;position:relative;padding:0 clamp(22px,5.8vw,100px) 30px;color:#91938e;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:850px){.content{align-items:end;padding-bottom:12vh}.message{width:100%;max-width:620px}.products{opacity:.58}.product{max-height:48vh}.p1{top:10%;right:-26%;width:80vw}.p2{top:18%;right:23%;width:66vw}.p3{top:3%;right:29%;width:66vw}.p4{top:25%;right:-25%;width:70vw}h1{font-size:clamp(40px,10vw,72px)}.subtitle{font-size:12px}.brandline{font-size:9px}}
@media(max-width:520px){.header{padding-top:25px}.product{max-height:39vh}.p1{right:-35%;top:11%}.p2{right:17%;top:12%}.p3{right:30%;top:3%}.p4{right:-33%;top:22%}.content{padding-bottom:13vh}h1{font-size:clamp(38px,12vw,60px)}.subtitle{max-width:340px}.intro{min-height:100svh}.footer{padding-bottom:18px}}
@media(prefers-reduced-motion:reduce){.product,.message>*{animation:none!important}.p1{opacity:.79;transform:rotate(-4deg)}.p2{opacity:.76;transform:rotate(2deg)}.p3{opacity:.52;transform:rotate(-3deg)}.p4{opacity:.58;transform:rotate(5deg)}.action,.action svg{transition:none}}
</style>
</head>
<body>
<main class="intro">
  <header class="header"><div class="wordmark">FICOESA<small>CREATIVE HUB</small></div><div class="brandline">FORLI / WORKO</div></header>
  <div class="products" aria-hidden="true"><img class="product p1" src="assets/prenda-1.png" alt=""><img class="product p2" src="assets/prenda-2.png" alt=""><img class="product p3" src="assets/prenda-3.png" alt=""><img class="product p4" src="assets/prenda-4.png" alt=""></div>
  <section class="content"><div class="message"><p class="eyebrow">FICOESA</p><h1><span>TODO EN UN</span><span class="yellow">MISMO LUGAR.</span></h1><p class="subtitle">DIRECTORIO DE DISEÑOS FICOESA FORLI/WORKO</p><div class="action-row"><a class="action" href="https://ficoesaweb-hub.github.io/DIRECTORIO-WEB-ONLINE/">ACCEDER AL DIRECTORIO <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 12h16M13 5l7 7-7 7"/></svg></a></div></div></section>
  <footer class="footer">FICOESA CREATIVE HUB</footer>
</main>
</body>
</html>
