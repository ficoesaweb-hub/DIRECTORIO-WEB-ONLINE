etween;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}.link-item:hover{color:var(--yellow)}.empty{border:1px dashed var(--line);padding:28px;color:var(--muted);line-height:1.7}.panel{padding:28px;border:1px solid var(--line);background:var(--surface);max-width:900px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}.field input,.field select,.field textarea{padding:12px;background:var(--bg);border:1px solid var(--line);color:var(--white);width:100%;border-radius:0}.field textarea{min-height:140px;resize:vertical}.field.full{grid-column:1/-1}.row-repeat{display:flex;align-items:center;gap:8px;margin:8px 0}.row-repeat input{flex:1;min-width:0}.row-repeat button{padding:10px;border:1px solid var(--line);background:transparent;color:var(--white)}.admin-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0 24px}.admin-row h2{margin-right:auto}.error{color:#ffc6c6}.notice{padding:18px;border:1px solid var(--line);background:var(--surface);line-height:1.65}.login-shell{min-height:calc(100vh - 130px);display:flex;justify-content:center;align-items:center}.login-card{border:1px solid var(--line);background:var(--surface);padding:clamp(24px,4vw,42px);max-width:480px;width:100%;display:grid;gap:16px}.login-card h1{font-size:30px;margin:0}.login-card p{color:var(--muted);line-height:1.65}.login-card input{padding:14px;background:var(--bg);border:1px solid var(--line);color:var(--white);width:100%}#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--yellow);color:#222;padding:14px 24px;font-weight:700;z-index:10;box-shadow:0 4px 20px #0008}footer{padding-top:60px;font-size:11px;color:#8f9595;letter-spacing:.09em}@media(max-width:750px){.detail{grid-template-columns:1fr}.detail-image{max-width:440px}.fields{grid-template-columns:1 </style></head><body><div class="app"><header class="top"><div class="identity"><b>FICOESA</b><small>CAJA DE HERRAMIENTAS DE MARKETING</small></div><a class="back" href="../?acceso=1">← Directorio de Redes Sociales</a><span class="account" id="account"></span><button class="btn ghost hidden" id="logout">Cerrar sesión</button></header><main id="main"><div class="empty">Comprobando acceso…</div></main><footer>FICOESA · WORKO / FORLI · Uso interno autorizado</footer></div><div id="flash" class="hidden" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./supabase-config.js"></script><script>
(()=>{'use strict';
const cfg=window.SUPABASE_CONFIG||window.FICOESA_CONFIG; const main=document.getElementById('main');const account=document.getElementById('account');const logout=document.getElementById('logout');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={fichas:'Fichas',merchandising:'Merchandising',plv:'PLV',recursos:'Recursos',catalogos:'Catálogos y folletos',novedades:'Novedades'};
const TYPES={tecnicas:'Fichas técnicas',comerciales:'Fichas comerciales',argumentarios:'Argumentarios',clientes:'Fichas clientes'};const BRANDS=['WORKO','FORLI','GENERAL'];const LINES=['Alta Visibilidad','Industria','Multinorma','Servicios'];
let sb=null,user=null,admin=false,allowed=false,items=[],links=[],files=[],route=[],editing=null,tempImage=null,uploadFiles=[];const id=v=>document.getElementById(v);
function flash(message){const el=id('flash');el.textContent=message;el.classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.add('hidden'),5000)}
function check(result){if(result.error)throw result.error;return result.data}
function headline(t,d=''){return `<div class="hero"><span class="kicker">FICOESA · WORKO / FORLI</span><h1>${esc(t)}</h1>${d?`<p>${esc(d)}</p>`:''}</div>`}
const btn=(label,act,val)=>`<button class="tile" data-act="${act}" data-value="${esc(val)}"><span>Explorar →</span><strong>${esc(label)}</strong></button>`;
function crumbs(){let chunks=[['Caja de herramientas',-1],...route.map((v,i)=>[label(v),i])];return `<div class="crumbs">${chunks.map(([t,i],j)=>`${j?'<i>›</i>':''}<button data-act="crumb" data-value="${i}">${esc(t)}</button>`).join('')}</div>`}
function label(v){return CATS[v]||TYPES[v]||v}
function visibleItems(){return items.filter(x=>admin||x.status==='published')}
function matching(arr){return visibleItems().filter(x=>{let c=arr[0];if(c&&x.category!==c)return false;let offset=c==='fichas'?1:0;if(offset&&arr[1]&&x.sheet_type!==arr[1])return false;let year=arr[1+offset],brand=arr[2+offset],line=arr[3+offset];return (!year||String(x.year)===year)&&(!brand||x.brand===brand)&&(!line||x.subcategory===line)})}
function navigate(next){route=next;editing=null;history.replaceState(null,'','#'+route.map(encodeURIComponent).join('/'));render();window.scrollTo({top:0,behavior:'smooth'})}
async function signed(path){if(!path)return null;const d=check(await sb.storage.from('marketing-toolbox').createSignedUrl(path,600));return d.signedUrl}
async function fillImages(){const nodes=[...main.querySelectorAll('[data-cover]')];await Promise.all(nodes.map(async el=>{try{const url=await signed(el.dataset.cover);if(url&&main.contains(el)){let im=document.createElement('img');im.alt='Portada';im.loading='lazy';im.src=url;el.replaceChildren(im)}}catch(e){console.warn('Portada no disponible',e.message)}}))}
function render(){if(!allowed){renderLogin();return}logout.classList.remove('hidden');account.textContent=`${user.email} · ${admin?'Administrador':'Consulta'}`;let html=headline('CAJA DE HERRAMIENTAS DE MARKETING','Materiales de WORKO, FORLI y FICOESA, independientes de las publicaciones de Redes Sociales.');
html+=`<div class="toolbar">${crumbs()}${admin?'<button class="btn primary" data-act="admin">Gestionar caja de herramientas</button>':''}</div>`;
if(route[0]==='admin'){if(!admin){main.innerHTML=html+'<div class="empty">Solo administradores.</div>';return}renderAdmin(html);return}
if(route[0]==='item'){renderItem(html);return}
let c=route[0];if(!c){html+='<div class="grid">'+Object.entries(CATS).map(([k,v])=>btn(v,'pick',k)).join('')+'</div>';}
else if(c==='fichas'&&!route[1]){html+='<div class="grid">'+Object.entries(TYPES).map(([k,v])=>btn(v,'pick',k)).join('')+'</div>'}
else {let offs=c==='fichas'?1:0;let step=route.length-(1+offs);let matches=matching(route);if(step===0){const years=[...new Set(matches.map(x=>String(x.year)))].sort((a,b)=>Number(b)-Number(a));html+=years.length?`<div class="grid">${years.map(y=>btn(y,'pick',y)).join('')}</div>`:'<div class="empty">Todavía no hay contenidos publicados en esta categoría.</div>'}
else if(step===1){const brands=BRANDS.filter(b=>matches.some(x=>x.brand===b));html+=`<div class="grid">${brands.map(b=>btn(b,'pick',b)).join('')}</div>`}
else if(step===2&&c==='fichas'&&route[3]==='WORKO'){const sub=[...new Set(matches.map(x=>x.subcategory||'Sin línea'))].sort();html+=`<div class="grid">${sub.map(s=>btn(s,'pick',s)).join('')}</div>`}
else{html+=`<div class="gallery">${matches.map(x=>`<button class="card" data-act="open" data-value="${x.id}"><span class="cover" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}><span class="no-img">✳</span></span><span class="card-info"><strong>${esc(x.title)}</strong><small>${esc(x.brand)} · ${x.year}${x.status==='draft'?' · BORRADOR':''}</small></span></button>`).join('')}</div>`;if(!matches.length)html+='<div class="empty">No hay contenidos en esta sección.</div>'}
}main.innerHTML=html;fillImages()}
async function renderItem(html){let x=items.find(a=>a.id===route[1]);if(!x||(!admin&&x.status!=='published')){main.innerHTML=html+'<div class="empty">Contenido no disponible.</div>';return}let ls=links.filter(a=>a.item_id===x.id),fs=files.filter(a=>a.item_id===x.id);html+=`<div class="detail"><div class="detail-image" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}>Sin imagen</div><div><span class="kicker">${esc(CATS[x.category])} · ${esc(x.brand)} · ${x.year}</span><h2>${esc(x.title)}</h2><section><h3>Descripción</h3><div class="description">${esc(x.description||'Sin descripción')}</div></section><section><h3>Enlaces</h3>${ls.length?ls.map(l=>`<a class="link-item" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">${esc(l.label)} <span>↗</span></a>`).join(''):'Sin enlaces'}</section><section><h3>Documentos para descargar</h3><div id="downloads">${fs.length?fs.map(f=>`<button class="link-item btn" data-act="download" data-value="${f.id}">↓ ${esc(f.file_name)}</button>`).join(''):'Sin archivos'}</div></section><section><h3>Autor</h3><p>Subido por: ${esc(x.author_email)}</p>${admin?`<button class="btn primary" data-act="edit" data-value="${x.id}">Editar contenido</button>`:''}</section></div></div>`;main.innerHTML=html;fillImages()}
function safeUrl(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function renderLogin(message=''){logout.classList.add('hidden');account.textContent='';main.innerHTML=`<div class="login-shell"><form class="login-card" id="login"><span class="kicker">FICOESA CREATIVE HUB</span><h1>Acceso privado</h1><p>Inicia sesión con tu cuenta autorizada. Son las mismas credenciales del Directorio de Redes Sociales.</p><input type="email" name="email" autocomplete="username" required placeholder="Correo electrónico"><input type="password" name="password" autocomplete="current-password" required placeholder="Contraseña"><button class="btn primary" type="submit">ACCEDER A LA CAJA DE HERRAMIENTAS →</button>${message?`<p class="error">${esc(message)}</p>`:''}<a class="back" href="../?acceso=1">Volver al directorio</a></form></div>`}
async function signIn(e){e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;try{check(await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))}));await initialize()}catch(err){renderLogin(err.message||'Error de acceso')}finally{b.disabled=false}}
async function initialize(){const result=check(await sb.auth.getUser());user=result.user;if(!user){allowed=false;renderLogin();return}admin=check(await sb.rpc('is_ficoesa_admin'))===true;allowed=admin||check(await sb.rpc('is_ficoesa_allowed'))===true;if(!allowed){await sb.auth.signOut();user=null;admin=false;renderLogin('Este correo no está autorizado.');return}await reload();render()}
async function reload(){const r=await Promise.all([sb.from('marketing_toolbox_items').select('*').order('created_at',{ascending:false}),sb.from('marketing_toolbox_links').select('*').order('sort_order'),sb.from('marketing_toolbox_files').select('*').order('sort_order')]);items=check(r[0])||[];links=check(r[1])||[];files=check(r[2])||[]}
function renderAdmin(html){if(route[1]==='form'){formHtml(html);return}html+=`<div class="admin-row"><h2>Gestionar Caja de Herramientas</h2><button class="btn primary" data-act="new">+ Nuevo contenido</button></div>`;html+=items.length?`<div class="gallery">${items.map(x=>`<div class="card"><div class="cover" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}>✳</div><div class="card-info"><strong>${esc(x.title)}</strong><small>${esc(CATS[x.category])} · ${x.year} · ${esc(x.brand)} · ${x.status==='published'?'Publicado':'Borrador'}</small><div class="admin-row"><button class="btn" data-act="edit" data-value="${x.id}">Editar</button><button class="btn danger" data-act="delete" data-value="${x.id}">Eliminar</button></div></div></div>`).join('')}</div>`:'<div class="empty">Todavía no hay elementos. Crea el primero.</div>';main.innerHTML=html;fillImages()}
function formHtml(html){let x=editing?items.find(i=>i.id===editing):null;let existingLinks=x?links.filter(a=>a.item_id===x.id):[];let existingFiles=x?files.filter(a=>a.item_id===x.id):[];html+=`<div class="admin-row"><h2>${x?'Editar':'Nuevo'} contenido</h2><button class="btn" data-act="admin">Volver a gestionar</button></div><form class="panel fields" id="item-form"><div class="field"><label>Categoría</label><select name="category" id="category">${Object.entries(CATS).map(([v,l])=>`<option value="${v}" ${x?.category===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field" id="type-wrap"><label>Tipo de ficha</label><select name="sheet_type">${Object.entries(TYPES).map(([v,l])=>`<option value="${v}" ${x?.sheet_type===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Año</label><input name="year" type="number" min="2020" max="2100" value="${x?.year||new Date().getFullYear()}" required></div><div class="field"><label>Marca</label><select name="brand" id="brand">${BRANDS.map(b=>`<option ${x?.brand===b?'selected':''}>${b}</option>`).join('')}</select></div><div class="field" id="sub-wrap"><label>Línea / subcategoría</label><select name="subcategory" id="subcategory">${[...new Set([...LINES,...items.map(a=>a.subcategory).filter(Boolean)])].map(s=>`<option ${x?.subcategory===s?'selected':''}>${esc(s)}</option>`).join('')}<option value="__custom">+ Añadir otra línea…</option></select><input id="custom-sub" placeholder="Nueva línea" class="hidden"></div><div class="field full"><label>Título *</label><input name="title" value="${esc(x?.title||'')}" required maxlength="180"></div><div class="field full"><label>Imagen de portada (JPG/PNG, máximo 5 MB)</label><input type="file" name="cover" accept="image/png,image/jpeg"><small>${x?.cover_path?'Hay una portada guardada. Si no eliges otra, se conserva.':'Opcional'}</small></div><div class="field full"><label>Texto explicativo</label><textarea name="description">${esc(x?.description||'')}</textarea></div><div class="field full"><label>Enlaces (nombre + URL)</label><div id="links-editor"></div><button class="btn" data-act="addlink" type="button">+ Añadir enlace</button></div><div class="field full"><label>Documentos adjuntos</label><div id="existing-files"></div><input type="file" id="files-input" multiple accept=".pdf,.docx,.xlsx,.svg,.jpg,.jpeg,.png,.zip,.doc,.xls,.pptx"><small>Archivos nuevos: ${x?'se añadirán a los ya existentes':'puedes seleccionar varios'}</small></div><div class="field"><label>Estado</label><select name="status"><option value="draft" ${x?.status!=='published'?'selected':''}>Borrador</option><option value="published" ${x?.status==='published'?'selected':''}>Publicado</option></select></div><div class="field"><label>Autor (automático)</label><input value="${esc(x?.author_email||user.email)}" disabled></div><div class="field full"><button type="submit" class="btn primary">${x?'GUARDAR CAMBIOS':'CREAR CONTENIDO'}</button><span id="save-msg"></span></div></form>`;main.innerHTML=html;existingLinks.forEach(l=>addLink(l.label,l.url));if(!existingLinks.length)addLink();let wrap=id('existing-files');wrap.innerHTML=existingFiles.map(f=>`<div class="row-repeat"><span style="flex:1">${esc(f.file_name)}</span><button type="button" data-act="removefile" data-value="${f.id}">Eliminar archivo</button></div>`).join('');adaptForm()}
function addLink(l='',u=''){let div=document.createElement('div');div.className='row-repeat';div.innerHTML=`<input class="in-label" aria-label="Nombre del enlace" placeholder="Nombre" value="${esc(l)}"><input class="in-url" aria-label="URL" type="url" placeholder="https://..." value="${esc(u)}"><button type="button" aria-label="Eliminar enlace">×</button>`;div.querySelector('button').onclick=()=>div.remove();id('links-editor').appendChild(div)}
function adaptForm(){let cat=id('category')?.value,brand=id('brand')?.value;id('type-wrap')?.classList.toggle('hidden',cat!=='fichas');id('sub-wrap')?.classList.toggle('hidden',cat!=='fichas'||brand!=='WORKO');id('custom-sub')?.classList.toggle('hidden',id('subcategory')?.value!=='__custom')}
async function saveItem(e){e.preventDefault();let form=e.target,b=form.querySelector('[type=submit]');b.disabled=true;id('save-msg').textContent='Guardando…';let saved=null;try{let d=new FormData(form);let image=d.get('cover');if(image?.size){if(image.size>5*1024*1024)throw Error('La portada supera el máximo de 5 MB');if(!['image/png','image/jpeg'].includes(image.type))throw Error('La portada debe ser JPG o PNG')};let category=d.get('category'),brand=d.get('brand'),sub=category==='fichas'&&brand==='WORKO'?(d.get('subcategory')==='__custom'?id('custom-sub').value.trim():d.get('subcategory')):null;if(category==='fichas'&&brand==='WORKO'&&!sub)throw Error('Selecciona o escribe una línea WORKO');let body={category,sheet_type:category==='fichas'?d.get('sheet_type'):null,year:Number(d.get('year')),brand,subcategory:sub,title:String(d.get('title')).trim(),description:String(d.get('description')||''),status:d.get('status')};if(!body.title)throw Error('Indica un título');if(editing){saved=check(await sb.from('marketing_toolbox_items').update(body).eq('id',editing).select().single())}else{saved=check(await sb.from('marketing_toolbox_items').insert(body).select().single())}
if(image?.size){const path=`${saved.id}/covers/${crypto.randomUUID()}-${image.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;check(await sb.storage.from('marketing-toolbox').upload(path,image,{contentType:image.type}));check(await sb.from('marketing_toolbox_items').update({cover_path:path}).eq('id',saved.id))}
const existing=links.filter(l=>l.item_id===saved.id);for(let l of existing)check(await sb.from('marketing_toolbox_links').delete().eq('id',l.id));const values=[...id('links-editor').querySelectorAll('.row-repeat')].map((r,i)=>({item_id:saved.id,label:r.querySelector('.in-label').value.trim(),url:r.querySelector('.in-url').value.trim(),sort_order:i})).filter(v=>v.label&&v.url);if(values.length)check(await sb.from('marketing_toolbox_links').insert(values));const docs=[...id('files-input').files];for(const [index,file] of docs.entries()){const path=`${saved.id}/files/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;check(await sb.storage.from('marketing-toolbox').upload(path,file,{contentType:file.type||'application/octet-stream'}));check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:file.name,object_path:path,file_type:file.type,file_size:file.size,sort_order:index}))}
await reload();flash('Contenido guardado correctamente');navigate(['admin']);}catch(err){id('save-msg').textContent=err.message;flash('Error: '+err.message);if(saved)await reload()}finally{b.disabled=false}}
async function doDownload(fileid){let f=files.find(x=>x.id===fileid);if(!f)return;try{const blob=check(await sb.storage.from('marketing-toolbox').download(f.object_path));const href=URL.createObjectURL(blob);let a=document.createElement('a');a.href=href;a.download=f.file_name;a.click();setTimeout(()=>URL.revokeObjectURL(href),15000)}catch(e){flash(e.message)}}
async function deleteItem(itemid){if(!confirm('¿Eliminar este contenido y sus archivos? Esta acción no se puede deshacer.'))return;try{let paths=files.filter(f=>f.item_id===itemid).map(x=>x.object_path);let cover=items.find(x=>x.id===itemid)?.cover_path;if(cover)paths.push(cover);if(paths.length)check(await sb.storage.from('marketing-toolbox').remove(paths));check(await sb.from('marketing_toolbox_items').delete().eq('id',itemid));await reload();navigate(['admin']);flash('Contenido eliminado')}catch(err){flash(err.message)}}
async function removeFile(fid){if(!confirm('¿Eliminar este archivo adjunto?'))return;let f=files.find(x=>x.id===fid);if(!f)return;try{check(await sb.storage.from('marketing-toolbox').remove([f.object_path]));check(await sb.from('marketing_toolbox_files').delete().eq('id',fid));await reload();editing=f.item_id;render()}catch(e){flash(e.message)}}
main.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.value;try{if(a==='crumb')navigate(Number(v)<0?[]:route.slice(0,Number(v)+1));if(a==='pick')navigate([...route,v]);if(a==='open')navigate(['item',v]);if(a==='admin')navigate(['admin']);if(a==='new'){editing=null;navigate(['admin','form'])}if(a==='edit'){editing=v;route=['admin','form'];render()}if(a==='addlink')addLink();if(a==='download')await doDownload(v);if(a==='delete')await deleteItem(v);if(a==='removefile')await removeFile(v)}catch(err){flash(err.message)}});
main.addEventListener('change',e=>{if(['category','brand','subcategory'].includes(e.target.id))adaptForm()});main.addEventListener('submit',e=>{if(e.target.id==='login')signIn(e);if(e.target.id==='item-form')saveItem(e)});logout.addEventListener('click',async()=>{await sb.auth.signOut();user=null;allowed=false;admin=false;items=[];links=[];files=[];route=[];renderLogin()});
async function start(){if(!cfg?.url||!(cfg.anonKey||cfg.publishableKey)||!window.supabase){main.innerHTML='<div class="empty">Falta la conexión pública de Supabase. Comprueba supabase-config.js y la librería Supabase.</div>';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey||cfg.publishableKey);let hash=location.hash.slice(1);route=hash?hash.split('/').map(decodeURIComponent):[];if(route.some(x=>x==='..'))route=[];try{await initialize()}catch(err){console.error(err);main.innerHTML=`<div class="empty">No se pudo conectar con Caja de Herramientas: ${esc(err.message)}. Primero instala el SQL incluido en el paquete y vuelve a cargar.</div>`}}start();
})();
</script></body></html>
