</style></head><body><div class="app"><header class="top"><div class="identity"><b>FICOESA</b><small>CAJA DE HERRAMIENTAS DE MARKETING</small></div><a class="back" href="../intro/">← Volver a la intro</a><a class="back" href="../connect/">FICOESA Connect ↗ <span class="connect-notification-dot" data-connect-notification hidden aria-label="Mensajes nuevos"></span></a><span class="account" id="account"></span><button class="btn ghost hidden" id="logout">Cerrar sesión</button></header><main id="main"><div class="empty">Comprobando acceso…</div></main><footer>FICOESA · WORKO / FORLI · Uso interno autorizado</footer></div><div id="flash" class="hidden" role="status"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="./supabase-config.js"></script><script src="../connect/supabase-config.js"></script><script src="../connect-notifications.js"></script><script>
(()=>{'use strict';
const cfg=window.SUPABASE_CONFIG||window.FICOESA_CONFIG; const main=document.getElementById('main');const account=document.getElementById('account');const logout=document.getElementById('logout');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={fichas:'Fichas',merchandising:'Merchandising',plv:'PLV',recursos:'Recursos',catalogos:'Catálogos y folletos',novedades:'Novedades'};
const TYPES={tecnicas:'Fichas técnicas',comerciales:'Fichas comerciales',argumentarios:'Argumentarios',clientes:'Fichas clientes'};const BRANDS=['WORKO','FORLI','GENERAL'];const LINES=['Alta Visibilidad','Industria','Multinorma','Servicios'];
let sb=null,user=null,admin=false,allowed=false,worker=false,items=[],links=[],files=[],route=[],editing=null,tempImage=null,uploadFiles=[];let coverSlides=[],removedCoverSlides=[];let categoryOrder=Object.keys(CATS),categoryOrderReady=false,categoryOrderSaving=false,draggedCategory=null;let searchText="";const id=v=>document.getElementById(v);
function flash(message){const el=id('flash');el.textContent=message;el.classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.add('hidden'),5000)}
function check(result){if(result.error)throw result.error;return result.data}
function headline(t,d=''){return `<div class="hero"><span class="kicker">FICOESA · WORKO / FORLI</span><h1>${esc(t)}</h1>${d?`<p>${esc(d)}</p>`:''}</div>`}
function orderedCategories(){return [...categoryOrder.filter(k=>Object.hasOwn(CATS,k)),...Object.keys(CATS).filter(k=>!categoryOrder.includes(k))]}
async function loadCategoryOrder(){const res=await sb.from('marketing_toolbox_settings').select('value').eq('key','category_order').maybeSingle();if(res.error){categoryOrderReady=false;console.warn('Orden no disponible:',res.error.message);return}let incoming=res.data?.value;categoryOrder=Array.isArray(incoming)?[...new Set(incoming.filter(k=>Object.hasOwn(CATS,k)))]:Object.keys(CATS);categoryOrderReady=true}
async function saveCategoryOrder(order){if(!admin||!categoryOrderReady||categoryOrderSaving)return;categoryOrderSaving=true;const old=[...categoryOrder];categoryOrder=[...order];render();try{check(await sb.from('marketing_toolbox_settings').upsert({key:'category_order',value:categoryOrder},{onConflict:'key'}));flash('Orden de secciones guardado')}catch(err){categoryOrder=old;render();flash('No se pudo guardar el orden: '+err.message)}finally{categoryOrderSaving=false}}
function categoryTiles(){return `<div class="category-sort-grid" id="category-sort-grid">${orderedCategories().map((k,i)=>`<div class="category-sort-card" data-category="${esc(k)}" ${admin&&categoryOrderReady?'draggable="true"':''}>${btn(CATS[k],'pick',k)}${admin?`<div class="category-sort-tools"><button type="button" class="category-sort-handle" title="Arrastra para ordenar" aria-label="Arrastrar ${esc(CATS[k])}">⠿</button><button type="button" data-act="move-category" data-value="${esc(k)}" data-dir="-1" title="Mover a la izquierda" aria-label="Mover ${esc(CATS[k])} antes" ${i===0?'disabled':''}>←</button><button type="button" data-act="move-category" data-value="${esc(k)}" data-dir="1" title="Mover a la derecha" aria-label="Mover ${esc(CATS[k])} después" ${i===orderedCategories().length-1?'disabled':''}>→</button></div>`:''}</div>`).join('')}</div>`}
const btn=(label,act,val)=>`<button class="tile" data-act="${act}" data-value="${esc(val)}"><span>Explorar →</span><strong>${esc(label)}</strong></button>`;
function crumbs(){let chunks=[['Caja de herramientas',-1],...route.map((v,i)=>[label(v),i])];return `<div class="crumbs">${chunks.map(([t,i],j)=>`${j?'<i>›</i>':''}<button data-act="crumb" data-value="${i}">${esc(t)}</button>`).join('')}</div>`}
function label(v){return CATS[v]||TYPES[v]||v}
function visibleItems(){return items.filter(x=>admin||worker||x.status==='published'||x.status==='draft')}
function matching(arr){return visibleItems().filter(x=>{let c=arr[0];if(c&&x.category!==c)return false;let offset=c==='fichas'?1:0;if(offset&&arr[1]&&x.sheet_type!==arr[1])return false;let year=arr[1+offset],brand=arr[2+offset],line=arr[3+offset];return (!year||String(x.year)===year)&&(!brand||x.brand===brand)&&(!line||x.subcategory===line)})}
function itemCard(x){return `<button class="card" data-act="open" data-value="${esc(x.id)}"><span class="cover" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}><span class="no-img">✳</span></span><span class="card-info"><strong>${esc(x.title)}</strong><small>${esc(CATS[x.category])} · ${esc(x.brand)} · ${x.year}${x.status==='draft'?' · BORRADOR':''}</small></span></button>`}
function searchResultsHtml(){const term=searchText.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();const matches=visibleItems().filter(x=>String(x.title||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(term));return `<div class="kicker" style="margin:8px 0 18px">${matches.length} ${matches.length===1?'resultado':'resultados'} por título</div>`+(matches.length?`<div class="gallery">${matches.map(itemCard).join('')}</div>`:'<div class="empty">No hay recursos con ese título.</div>')}
function navigate(next){if(route[0]==='admin'&&route[1]==='form'&&!(next[0]==='admin'&&next[1]==='form'))releasePending();route=next;editing=null;history.replaceState(null,'','#'+route.map(encodeURIComponent).join('/'));render();window.scrollTo({top:0,behavior:'smooth'})}
async function signed(path){if(!path)return null;const d=check(await sb.storage.from('marketing-toolbox').createSignedUrl(path,600));return d.signedUrl}
async function fillImages(){const nodes=[...main.querySelectorAll('[data-cover]')];await Promise.all(nodes.map(async el=>{try{const url=await signed(el.dataset.cover);if(url&&main.contains(el)){let im=document.createElement('img');im.alt='Portada';im.loading='lazy';im.src=url;el.replaceChildren(im)}}catch(e){console.warn('Portada no disponible',e.message)}}))}
function render(){if(!allowed){renderLogin();return}logout.classList.remove('hidden');account.textContent=`${user.email} · ${admin?'Administrador':worker?'WORKER':'Consulta'}`;let html=headline('CAJA DE HERRAMIENTAS DE MARKETING','Materiales de WORKO, FORLI y FICOESA, independientes de las publicaciones de Redes Sociales.');
html+=`<div class="toolbar">${crumbs()}${admin?'<button class="btn primary" data-act="admin">Gestionar caja de herramientas</button>':worker?'<button class="btn primary" data-act="new">+ Añadir recurso</button>':''}</div>`;
if(route[0]!=='admin'&&route[0]!=='item'){
html+=`<div class="tool-search"><label for="tool-search-input">BUSCAR RECURSOS POR TÍTULO</label><div class="tool-search-line"><input id="tool-search-input" type="search" value="${esc(searchText)}" autocomplete="off" placeholder="Escribe el título de una ficha, recurso, PLV…" aria-label="Buscar por título"><button class="btn ghost" type="button" id="tool-search-clear">Limpiar</button></div></div><section id="tool-search-results" ${searchText.trim()?'':'hidden'}></section><div id="tool-browse" ${searchText.trim()?'hidden':''}>`;
}
if(route[0]==='admin'){if(!admin && !(worker&&route[1]==='form'&&!editing)){main.innerHTML=html+'<div class="empty">Solo administradores.</div>';return}renderAdmin(html);return}
if(route[0]==='item'){renderItem(html);return}
let c=route[0];if(!c){html+=(admin?`<p class="category-sort-hint">${categoryOrderReady?'Arrastra las secciones o usa las flechas para cambiar su orden. Se guarda para todos los usuarios.':'Para guardar el orden compartido, aplica primero el archivo SQL de configuración.'}</p>`:'')+categoryTiles();}
else if(c==='fichas'&&!route[1]){html+='<div class="grid">'+Object.entries(TYPES).map(([k,v])=>btn(v,'pick',k)).join('')+'</div>'}
else {let offs=c==='fichas'?1:0;let step=route.length-(1+offs);let matches=matching(route);if(step===0){const years=[...new Set(matches.map(x=>String(x.year)))].sort((a,b)=>Number(b)-Number(a));html+=years.length?`<div class="grid">${years.map(y=>btn(y,'pick',y)).join('')}</div>`:'<div class="empty">Todavía no hay contenidos publicados en esta categoría.</div>'}
else if(step===1){const brands=BRANDS.filter(b=>matches.some(x=>x.brand===b));html+=`<div class="grid">${brands.map(b=>btn(b,'pick',b)).join('')}</div>`}
else if(step===2&&c==='fichas'&&route[3]==='WORKO'){const sub=[...new Set(matches.map(x=>x.subcategory||'Sin línea'))].sort();html+=`<div class="grid">${sub.map(s=>btn(s,'pick',s)).join('')}</div>`}
else{html+=`<div class="gallery">${matches.map(x=>`<button class="card" data-act="open" data-value="${x.id}"><span class="cover" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}><span class="no-img">✳</span></span><span class="card-info"><strong>${esc(x.title)}</strong><small>${esc(x.brand)} · ${x.year}${x.status==='draft'?' · BORRADOR':''}</small></span></button>`).join('')}</div>`;if(!matches.length)html+='<div class="empty">No hay contenidos en esta sección.</div>'}

const imageFile=f=>/\.(png|jpe?g|webp|gif|svg)$/i.test(f.file_name||f.name||'')||String(f.file_type||f.type||'').startsWith('image/');

  const values=[...id('links-editor').querySelectorAll('.row-repeat')].map((r,i)=>({item_id:saved.id,label:r.querySelector('.in-label').value.trim(),url:r.querySelector('.in-url').value.trim(),sort_order:i})).filter(v=>v.label&&v.url);
  if(values.length)check(await sb.from('marketing_toolbox_links').insert(values));
  for(const [index,file] of uploadFiles.map(x=>x.file).entries()){
    const path=`${saved.id}/files/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
    check(await bucket.upload(path,file,{contentType:file.type||'application/octet-stream'}));
    check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:file.name,object_path:path,file_type:file.type,file_size:file.size,sort_order:index}));
  }
}
async function doDownload(fileid){let f=files.find(x=>x.id===fileid);if(!f)return;try{const blob=check(await sb.storage.from('marketing-toolbox').download(f.object_path));const href=URL.createObjectURL(blob);let a=document.createElement('a');a.href=href;a.download=f.file_name;a.click();setTimeout(()=>URL.revokeObjectURL(href),15000)}catch(e){flash(e.message)}}
async function deleteItem(itemid){if(!confirm('¿Eliminar este contenido y sus archivos? Esta acción no se puede deshacer.'))return;try{let paths=files.filter(f=>f.item_id===itemid).map(x=>x.object_path);let cover=items.find(x=>x.id===itemid)?.cover_path;if(cover&&!paths.includes(cover))paths.push(cover);if(paths.length)check(await sb.storage.from('marketing-toolbox').remove(paths));check(await sb.from('marketing_toolbox_items').delete().eq('id',itemid));await reload();navigate(['admin']);flash('Contenido eliminado')}catch(err){flash(err.message)}}
async function removeFile(fid){if(!confirm('¿Eliminar este archivo adjunto?'))return;let f=files.find(x=>x.id===fid);if(!f)return;try{check(await sb.storage.from('marketing-toolbox').remove([f.object_path]));check(await sb.from('marketing_toolbox_files').delete().eq('id',fid));await reload();editing=f.item_id;render()}catch(e){flash(e.message)}}
main.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.value;try{if(a==='move-category'){let ordered=orderedCategories(),from=ordered.indexOf(v),to=from+Number(b.dataset.dir);if(from>=0&&to>=0&&to<ordered.length){ordered.splice(to,0,ordered.splice(from,1)[0]);await saveCategoryOrder(ordered)}}if(a==='crumb')navigate(Number(v)<0?[]:route.slice(0,Number(v)+1));if(a==='pick')navigate([...route,v]);if(a==='open')navigate(['item',v]);if(a==='admin')navigate(['admin']);if(a==='new'&&(admin||worker)){releasePending();editing=null;navigate(['admin','form'])}if(a==='edit'){releasePending();editing=v;route=['admin','form'];render()}if(a==='addlink')addLink();if(a==='download')await doDownload(v);if(a==='delete')await deleteItem(v);if(a==='removefile')await removeFile(v);if(a==='primary-cover'){coverSlides.forEach((g,i)=>g.primary=i===Number(v));renderCoverEditor()}if(a==='shift-cover')moveCover(Number(v),Number(v)+Number(b.dataset.dir));if(a==='remove-cover'){let g=coverSlides.splice(Number(v),1)[0];if(g){if(g.path)removedCoverSlides.push(g);if(g.localUrl)URL.revokeObjectURL(g.localUrl);if(g.primary&&coverSlides.length)coverSlides[0].primary=true}renderCoverEditor()}if(a==='slide')stepCarousel(b);if(a==='remove-pending'){let n=Number(v);if(uploadFiles[n]?.localUrl)URL.revokeObjectURL(uploadFiles[n].localUrl);uploadFiles.splice(n,1);renderPending()}}catch(err){flash(err.message)}});
main.addEventListener('dragstart',e=>{const card=e.target.closest('.category-sort-card');if(!card||!admin||!categoryOrderReady)return;draggedCategory=card.dataset.category;card.classList.add('sort-dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedCategory)});
main.addEventListener('dragover',e=>{if(!draggedCategory)return;const card=e.target.closest('.category-sort-card');if(card){e.preventDefault();e.dataTransfer.dropEffect='move';main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.toggle('sort-over',c===card))}});
main.addEventListener('drop',e=>{if(!draggedCategory)return;const card=e.target.closest('.category-sort-card');if(!card)return;e.preventDefault();const from=draggedCategory,to=card.dataset.category;draggedCategory=null;main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.remove('sort-over','sort-dragging'));if(from===to)return;const order=orderedCategories();order.splice(order.indexOf(to),0,order.splice(order.indexOf(from),1)[0]);saveCategoryOrder(order)});
main.addEventListener('dragend',()=>{draggedCategory=null;main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.remove('sort-over','sort-dragging'))});
let draggedCover=-1;main.addEventListener('dragstart',e=>{let card=e.target.closest('.cover-edit-card');if(card){draggedCover=Number(card.dataset.coverIndex);e.dataTransfer.effectAllowed='move'}});main.addEventListener('dragover',e=>{if(draggedCover>=0&&e.target.closest('.cover-edit-card'))e.preventDefault()});main.addEventListener('drop',e=>{let card=e.target.closest('.cover-edit-card');if(card&&draggedCover>=0){e.preventDefault();moveCover(draggedCover,Number(card.dataset.coverIndex));draggedCover=-1}});main.addEventListener('dragend',()=>{draggedCover=-1});
main.addEventListener('scroll',e=>{if(e.target.classList?.contains('asset-track'))updateCarousel(e.target.closest('.asset-carousel'))},true);
 main.addEventListener('input',e=>{if(e.target.id!=='tool-search-input')return;searchText=e.target.value;const show=!!searchText.trim();id('tool-browse').hidden=show;id('tool-search-results').hidden=!show;if(show){id('tool-search-results').innerHTML=searchResultsHtml();fillImages()}});
main.addEventListener('click',e=>{if(e.target.id==='tool-search-clear'){searchText='';const field=id('tool-search-input');if(field)field.value='';id('tool-search-results').hidden=true;id('tool-browse').hidden=false;field?.focus()}});
main.addEventListener('change',e=>{if(['category','brand','subcategory'].includes(e.target.id))adaptForm()});main.addEventListener('submit',e=>{if(e.target.id==='login')signIn(e);if(e.target.id==='item-form')saveItem(e)});logout.addEventListener('click',async()=>{await sb.auth.signOut();user=null;allowed=false;admin=false;items=[];links=[];files=[];route=[];renderLogin()});
async function start(){if(!cfg?.url||!(cfg.anonKey||cfg.publishableKey)||!window.supabase){main.innerHTML='<div class="empty">Falta la conexión pública de Supabase. Comprueba supabase-config.js y la librería Supabase.</div>';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey||cfg.publishableKey);let hash=location.hash.slice(1);route=hash?hash.split('/').map(decodeURIComponent):[];if(route.some(x=>x==='..'))route=[];try{await initialize()}catch(err){console.error(err);main.innerHTML=`<div class="empty">No se pudo iniciar la Caja de Herramientas: ${esc(err.message)}. Comprueba la conexión o contacta con el administrador.</div>`}}start();
})();
</script></body></html>
