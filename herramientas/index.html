(()=>{'use strict';
const cfg=window.SUPABASE_CONFIG||window.FICOESA_CONFIG; const main=document.getElementById('main');const account=document.getElementById('account');const logout=document.getElementById('logout');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={fichas:'Fichas',merchandising:'Merchandising',plv:'PLV Y MOBILIARIO',recursos:'Recursos',catalogos:'Catálogos y folletos',ferias:'FERIAS Y EXPOSICIONES',novedades:'Novedades'};
const TYPES={tecnicas:'Fichas técnicas',comerciales:'Fichas comerciales',argumentarios:'Argumentarios',clientes:'Fichas clientes'};const BRANDS=['WORKO','FORLI','GENERAL'];const LINES=['Alta Visibilidad','Industria','Multinorma','Servicios'];
let sb=null,user=null,admin=false,allowed=false,worker=false,items=[],links=[],files=[],route=[],editing=null,tempImage=null,uploadFiles=[];let coverSlides=[],removedCoverSlides=[];let categoryOrder=Object.keys(CATS),categoryOrderReady=false,categoryOrderSaving=false,draggedCategory=null;let searchText="",lastBrowseRoute=[];const id=v=>document.getElementById(v);
function flash(message){const el=id('flash');el.textContent=message;el.classList.remove('hidden');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.add('hidden'),5000)}
function check(result){if(result.error)throw result.error;return result.data}
function headline(t,d=''){const home=!route.length;return `<section class="hub-hero ${home?'hub-hero-home':''}"><div class="hub-hero-copy"><span class="hub-eyebrow"><span class="hub-eyebrow-dot"></span> FICOESA / CREATIVE HUB / RECURSOS</span><h1>${esc(t)}</h1>${d?`<p>${esc(d)}</p>`:''}</div><div class="hub-hero-mark" aria-hidden="true"><span>F</span><small>CREATIVE<br>RESOURCES</small></div></section>`}
function orderedCategories(){return [...categoryOrder.filter(k=>Object.hasOwn(CATS,k)),...Object.keys(CATS).filter(k=>!categoryOrder.includes(k))]}
async function loadCategoryOrder(){const res=await sb.from('marketing_toolbox_settings').select('value').eq('key','category_order').maybeSingle();if(res.error){categoryOrderReady=false;console.warn('Orden no disponible:',res.error.message);return}let incoming=res.data?.value;categoryOrder=Array.isArray(incoming)?[...new Set(incoming.filter(k=>Object.hasOwn(CATS,k)))]:Object.keys(CATS);categoryOrderReady=true}
async function saveCategoryOrder(order){if(!admin||!categoryOrderReady||categoryOrderSaving)return;categoryOrderSaving=true;const old=[...categoryOrder];categoryOrder=[...order];render();try{check(await sb.from('marketing_toolbox_settings').upsert({key:'category_order',value:categoryOrder},{onConflict:'key'}));flash('Orden de secciones guardado')}catch(err){categoryOrder=old;render();flash('No se pudo guardar el orden: '+err.message)}finally{categoryOrderSaving=false}}
const CAT_SYMBOL={fichas:'▤',merchandising:'✳',plv:'◈',recursos:'⌘',catalogos:'▧',ferias:'◉',novedades:'✦'};
const ICON_PATHS={
 fichas:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 merchandising:'<path d="M3 9h18v11H3zM3 9l4-6h10l4 6M12 3v17M3 13h18"/>',
 plv:'<rect x="3" y="4" width="18" height="12" rx="1"/><path d="M12 16v5M7 21h10M7 9h10M7 12h6"/>',
 recursos:'<path d="M12 2v5M12 17v5M4.9 4.9l3.5 3.5m7.2 7.2 3.5 3.5M2 12h5m10 0h5M4.9 19.1l3.5-3.5m7.2-7.2 3.5-3.5"/><circle cx="12" cy="12" r="3"/>',
 catalogos:'<path d="M4 5c3-1 5-1 8 1 3-2 5-2 8-1v14c-3-1-5-1-8 1-3-2-5-2-8-1zM12 6v14M7 9h2m6 0h2M7 13h2m6 0h2"/>',
 ferias:'<path d="M3 9l9-6 9 6M5 9h14v12H5zM9 21v-8h6v8M3 9h18M8 6v3m8-3v3"/>',
 novedades:'<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3zM3 11h18"/>'
};
function catIcon(key){return `<svg class="cat-svg" aria-hidden="true" viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[key]||ICON_PATHS.folder}</svg>`;}
const LEGACY_SECTION='__sin_seccion__';
let sections=[],sectionsReady=false,sectionNotice='',sectionEditing=null;
const sectionsFor=c=>sections.filter(x=>x.category===c&&x.active!==false).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'es'));
const sectionName=sid=>sid===LEGACY_SECTION?'Sin subdivisión':sections.find(x=>String(x.id)===String(sid))?.name||'Subdivisión';
function sectionSegment(x){return x.section_id ? String(x.section_id) : LEGACY_SECTION;}
function sectionOptionsHtml(cat,selected){let opts=sectionsFor(cat);return `<option value="">Sin subdivisión</option>`+opts.map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)}</option>`).join('');}
async function loadSections(){const res=await sb.from('marketing_toolbox_sections').select('id,category,name,active,sort_order').order('sort_order',{ascending:true});if(res.error){sectionsReady=false;sectionNotice='Las subdivisiones necesitan la migración SQL V3.3: '+res.error.message;console.warn(sectionNotice);return}sections=res.data||[];sectionsReady=true;sectionNotice=''}

const CAT_DESC={fichas:'Documentación técnica y comercial',merchandising:'Material promocional y de marca',plv:'Expositores, soportes y equipamiento',recursos:'Herramientas y recursos gráficos',catalogos:'Ediciones ordenadas por año',ferias:'Stands, eventos y exposiciones',novedades:'Lanzamientos y materiales recientes'};
function categoryTiles(){const all=orderedCategories();return `<div class="category-sort-grid" id="category-sort-grid">${all.map((k,i)=>{let n=visibleItems().filter(x=>x.category===k).length;return `<div class="category-sort-card" data-category="${esc(k)}" ${admin&&categoryOrderReady?'draggable="true"':''}><button class="tile category-feature" data-act="pick" data-value="${esc(k)}"><span class="cat-top"><span class="cat-symbol" aria-hidden="true">${catIcon(k)}</span><span class="cat-index">${String(i+1).padStart(2,'0')}</span></span><span class="cat-main"><strong>${esc(CATS[k])}</strong><small>${esc(CAT_DESC[k]||'Materiales de marketing')}</small></span><span class="cat-foot"><span>${n} ${n===1?'recurso':'recursos'}</span><span class="cat-arrow">↗</span></span></button>${admin?`<div class="category-sort-tools"><button type="button" class="category-sort-handle" title="Arrastra para ordenar" aria-label="Arrastrar ${esc(CATS[k])}">⠿</button><button type="button" data-act="move-category" data-value="${esc(k)}" data-dir="-1" title="Mover antes" aria-label="Mover ${esc(CATS[k])} antes" ${i===0?'disabled':''}>←</button><button type="button" data-act="move-category" data-value="${esc(k)}" data-dir="1" title="Mover después" aria-label="Mover ${esc(CATS[k])} después" ${i===all.length-1?'disabled':''}>→</button></div>`:''}</div>`}).join('')}</div>`}
const btn=(label,act,val,count=null)=>`<button class="tile folder-tile" data-act="${act}" data-value="${esc(val)}"><span class="folder-top"><span class="folder-icon" aria-hidden="true">${catIcon("folder")}</span><span class="folder-arrow">↗</span></span><strong>${esc(label)}</strong>${count!==null?`<small>${count} ${count===1?'recurso':'recursos'}</small>`:'<small>Explorar materiales</small>'}</button>`;
function routeLink(path){return esc(path.map(encodeURIComponent).join('/'))}
function browseRouteFor(x){let p=[x.category];if(x.category==='fichas'&&x.sheet_type)p.push(x.sheet_type);if(sectionsFor(x.category).length || sections.some(z=>z.id===x.section_id))p.push(sectionSegment(x));p.push(String(x.year));return p}
function crumbs(){const chunk=[['Caja de herramientas',[]]];if(route[0]==='item'){const x=items.find(i=>String(i.id)===route[1]);if(x){let p=browseRouteFor(x);for(let i=0;i<p.length;i++)chunk.push([label(p[i]),p.slice(0,i+1)]);chunk.push([x.title,route])}}else if(route[0]==='admin'){chunk.push(['Administración',['admin']]);if(route[1]==='form')chunk.push([editing?'Editar recurso':'Nuevo recurso',route]);if(route[1]==='sections')chunk.push(['Administrar subdivisiones',route]);}else{route.forEach((v,i)=>chunk.push([label(v),route.slice(0,i+1)]))}return `<nav class="crumbs" aria-label="Ruta de navegación">${chunk.map(([t,path],j)=>`${j?'<i aria-hidden="true">/</i>':''}${j===chunk.length-1?`<span class="crumb-current">${esc(t)}</span>`:`<button type="button" data-act="go-route" data-value="${routeLink(path)}">${esc(t)}</button>`}`).join('')}</nav>`}
function label(v){return CATS[v]||TYPES[v]||(v===LEGACY_SECTION||sections.some(s=>s.id===v)?sectionName(v):v)}
function visibleItems(){return items.filter(x=>admin||worker||x.status==='published'||x.status==='draft')}
function matching(arr){return visibleItems().filter(x=>{const c=arr[0];if(c&&x.category!==c)return false;let i=1;if(c==='fichas'){if(arr[i]&&x.sheet_type!==arr[i])return false;i++}const sectionUsed=sectionsFor(c).length>0||arr[i]===LEGACY_SECTION||sections.some(s=>s.id===arr[i]);if(sectionUsed){if(arr[i]&&sectionSegment(x)!==arr[i])return false;i++}const year=arr[i];return !year||String(x.year)===String(year)})}
function itemCard(x){return `<button class="card resource-card" data-act="open" data-value="${esc(x.id)}" aria-label="Abrir ${esc(x.title)}"><span class="cover" ${x.cover_path?`data-cover="${esc(x.cover_path)}"`:''}><span class="no-img">${CAT_SYMBOL[x.category]||'✳'}</span></span><span class="card-info"><span class="card-tag">${esc(CATS[x.category]||'Material')} <span>· ${esc(x.year)}</span></span><strong>${esc(x.title)}</strong><span class="card-bottom"><small>${x.status==='draft'?'BORRADOR':(x.category==='fichas'&&x.sheet_type?esc(TYPES[x.sheet_type]||x.sheet_type):'RECURSO DISPONIBLE')}</small><span class="card-explore" aria-hidden="true">↗</span></span></span></button>`}
function searchResultsHtml(){const term=normaliseSearch(searchText);const matches=visibleItems().filter(x=>normaliseSearch([x.title,x.description,CATS[x.category],x.year,x.category==='fichas'?TYPES[x.sheet_type]:'',x.section_id?sectionName(x.section_id):''].join(' ')).includes(term));return `<div class="section-head"><div><span class="section-label">BUSCADOR</span><h2>${matches.length} ${matches.length===1?'resultado':'resultados'} encontrados</h2></div></div>`+(matches.length?`<div class="gallery">${matches.map(itemCard).join('')}</div>`:'<div class="empty">No se encontraron materiales. Prueba con otro término o año.</div>')}
function normaliseSearch(v){return String(v||'').toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function navigate(next,opts={}){if(route[0]==='admin'&&route[1]==='form'&&!(next[0]==='admin'&&next[1]==='form'))releasePending();if(next[0]==='item'&&route[0]!=='item')lastBrowseRoute=[...route];route=next;if(!opts.keepEditing)editing=null;const path='#'+route.map(encodeURIComponent).join('/');history[opts.replace?'replaceState':'pushState']({toolboxRoute:route},'',path);render();window.scrollTo({top:0,behavior:'smooth'})}
function backRoute(){if(route[0]==='item'){const x=items.find(i=>String(i.id)===route[1]);return lastBrowseRoute.length?[...lastBrowseRoute]:x?browseRouteFor(x):[]}if(route[0]==='admin')return route[1]==='form'?['admin']:[];return route.length?route.slice(0,-1):[]}
function categoryIntro(c){return CAT_DESC[c]||'Consulta los materiales disponibles de esta sección.'}

const imageFile=f=>/\.(png|jpe?g|webp|gif|svg)$/i.test(f.file_name||f.name||'')||String(f.file_type||f.type||'').startsWith('image/');
function carouselHtml(fs,carouselId){if(!fs.length)return '<div class="empty">No hay archivos adjuntos.</div>';return `<div class="asset-carousel" data-carousel="${esc(carouselId)}"><div class="asset-stage"><div class="asset-track">${fs.map((f,i)=>`<div class="asset-slide" data-slide="${i}" ${f.object_path&&imageFile(f)?`data-preview-path="${esc(f.object_path)}"`:''}>${f.localUrl&&imageFile(f)?`<img src="${esc(f.localUrl)}" alt="${esc(f.file_name||f.name)}">`:`<span class="asset-icon">${imageFile(f)?'▣':'▤'}</span>`}<strong>${esc(f.file_name||f.name)}</strong>${f.id?`<button class="btn" type="button" data-act="download" data-value="${esc(f.id)}">↓ Descargar archivo</button>`:''}</div>`).join('')}</div></div>${fs.length>1?`<div class="asset-nav"><button type="button" data-act="slide" data-dir="-1" aria-label="Anterior">←</button><span class="carousel-count">1 / ${fs.length}</span><div class="asset-dots">${fs.map((_,i)=>`<span class="asset-dot ${i===0?'active':''}"></span>`).join('')}</div><button type="button" data-act="slide" data-dir="1" aria-label="Siguiente">→</button></div>`:''}</div>`}
async function fillPreviews(){let nodes=[...main.querySelectorAll('[data-preview-path]')];await Promise.all(nodes.map(async el=>{try{const url=await signed(el.dataset.previewPath);if(url&&main.contains(el)){let img=document.createElement('img');img.src=url;img.alt=el.querySelector('strong')?.textContent||'Vista previa';img.loading='lazy';el.querySelector('.asset-icon')?.replaceWith(img)}}catch(e){console.warn('Vista previa no disponible',e.message)}}))}
function updateCarousel(car){if(!car)return;let track=car.querySelector('.asset-track');let count=car.querySelectorAll('.asset-slide').length;let i=Math.round(track.scrollLeft/Math.max(track.clientWidth,1));i=Math.max(0,Math.min(count-1,i));let counter=car.querySelector('.carousel-count');if(counter)counter.textContent=`${i+1} / ${count}`;car.querySelectorAll('.asset-dot').forEach((dot,j)=>dot.classList.toggle('active',i===j))}
function stepCarousel(button){let car=button.closest('.asset-carousel');let track=car.querySelector('.asset-track');let count=car.querySelectorAll('.asset-slide').length;let index=Math.round(track.scrollLeft/Math.max(track.clientWidth,1));track.scrollTo({left:Math.max(0,Math.min(count-1,index+Number(button.dataset.dir)))*track.clientWidth,behavior:'smooth'});setTimeout(()=>updateCarousel(car),320)}
function releasePending(){uploadFiles.forEach(f=>{if(f.localUrl)URL.revokeObjectURL(f.localUrl)});uploadFiles=[]}
function stageFiles(list){let current=new Set(uploadFiles.map(f=>f.file.name+'|'+f.file.size+'|'+f.file.lastModified));for(const f of Array.from(list||[])){if(!(f instanceof File)||!f.size)continue;let key=f.name+'|'+f.size+'|'+f.lastModified;if(current.has(key))continue;current.add(key);uploadFiles.push({file:f,localUrl:imageFile(f)?URL.createObjectURL(f):null})}renderPending()}
function renderPending(){let el=id('pending-files');if(!el)return;el.innerHTML=uploadFiles.map((x,i)=>`<div class="pending-file"><span>${esc(x.file.name)} <small>(${(x.file.size/1024/1024).toFixed(2)} MB)</small></span><button type="button" data-act="remove-pending" data-value="${i}">Quitar</button></div>`).join('');let summary=id('file-feedback');if(summary)summary.textContent=uploadFiles.length?`${uploadFiles.length} archivo(s) preparado(s) para subir. Se guardarán al pulsar Guardar.`:'Puedes subir varios archivos a la vez, incluidos documentos e imágenes.';let preview=id('pending-carousel');if(preview){preview.innerHTML=carouselHtml(uploadFiles.map(x=>({name:x.file.name,file_name:x.file.name,localUrl:x.localUrl,file_type:x.file.type})), 'pending');}}
function setupDropzones(){main.querySelectorAll('.dropzone').forEach(zone=>{let input=zone.querySelector('input[type=file]');zone.addEventListener('click',e=>{if(e.target!==input)input.click()});zone.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}});for(const evt of ['dragenter','dragover'])zone.addEventListener(evt,e=>{e.preventDefault();zone.classList.add('dragover')});for(const evt of ['dragleave','drop'])zone.addEventListener(evt,e=>{e.preventDefault();zone.classList.remove('dragover')});zone.addEventListener('drop',e=>{if(!e.dataTransfer?.files?.length)return;if(input.id==='files-input')stageFiles(e.dataTransfer.files);else if(input.id==='covers-input')addCoverFiles(e.dataTransfer.files);else{let images=[...e.dataTransfer.files].filter(f=>['image/png','image/jpeg'].includes(f.type));if(images.length){const dt=new DataTransfer();dt.items.add(images[0]);input.files=dt.files;let label=id('cover-feedback');if(label)label.textContent='Portada seleccionada: '+images[0].name}else flash('La portada debe ser JPG o PNG')}});input.addEventListener('change',()=>{if(input.id==='files-input'){stageFiles(input.files);input.value=''}else if(input.id==='covers-input'){addCoverFiles(input.files);input.value=''}else{let label=id('cover-feedback');if(label)label.textContent=input.files[0]?.name?'Portada seleccionada: '+input.files[0].name:'Portada opcional'}})})}

html+=`<div class="resource-heading"><div class="resource-title-meta"><span class="section-label">${esc(CATS[x.category]||'RECURSOS')} / ${esc(x.year)}</span><h2>${esc(x.title)}</h2><div class="resource-pills"><span>${esc(x.year)}</span>${type?`<span>${esc(type)}</span>`:''}${x.section_id?`<span>${esc(sectionName(x.section_id))}</span>`:''}<span>${x.status==='published'?'Publicado':'Borrador'}</span></div></div>${admin?`<button class="btn primary" type="button" data-act="edit" data-value="${esc(x.id)}">✎ Editar contenido</button>`:''}</div>`;

main.innerHTML=html;fillImages();fillPreviews()}
function fileSizeLabel(size){const n=Number(size);if(!Number.isFinite(n)||n<=0)return 'Archivo';return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.ceil(n/1024))+' KB'}
function safeUrl(url){try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function renderLogin(message=''){logout.classList.add('hidden');account.textContent='';main.innerHTML=`<div class="login-shell"><form class="login-card" id="login"><span class="kicker">FICOESA CREATIVE HUB</span><h1>Acceso privado</h1><p>Inicia sesión con tu cuenta autorizada. Son las mismas credenciales del Directorio de Redes Sociales.</p><input type="email" name="email" autocomplete="username" required placeholder="Correo electrónico"><input type="password" name="password" autocomplete="current-password" required placeholder="Contraseña"><button class="btn primary" type="submit">ACCEDER A LA CAJA DE HERRAMIENTAS →</button>${message?`<p class="error">${esc(message)}</p>`:''}<a class="back" href="../intro/">Volver a la intro</a></form></div>`}
async function signIn(e){e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;try{check(await sb.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))}));await initialize()}catch(err){renderLogin(err.message||'Error de acceso')}finally{b.disabled=false}}
async function initialize(){const sessionResult=await sb.auth.getSession();if(sessionResult.error)throw sessionResult.error;if(!sessionResult.data?.session){user=null;admin=false;allowed=false;renderLogin();return}const userResult=await sb.auth.getUser();if(userResult.error)throw userResult.error;user=userResult.data?.user;if(!user){admin=false;allowed=false;renderLogin();return}const rr=check(await sb.rpc('ficoesa_my_role'));admin=rr==='admin';worker=rr==='worker';allowed=['admin','worker','boss'].includes(rr);if(!allowed){await sb.auth.signOut();user=null;admin=false;renderLogin('Este correo no está autorizado.');return}await reload();await Promise.all([loadCategoryOrder(),loadSections()]);render();if(window.FICOESA_CONNECT_NOTIFICATIONS)window.FICOESA_CONNECT_NOTIFICATIONS.start(()=>Promise.resolve(user&&user.email))}

async function saveSection(e){e.preventDefault();if(!admin||!sectionsReady)return;const f=e.target,d=new FormData(f),category=String(d.get('category')),name=String(d.get('name')||'').trim(),sid=String(d.get('section_id')||'');if(!CATS[category]||name.length<2||name.length>80){flash('Elige una categoría y escribe un nombre entre 2 y 80 caracteres');return}let btn=f.querySelector('button[type="submit"]');btn.disabled=true;try{const payload={category,name,active:true};if(sid){check(await sb.from('marketing_toolbox_sections').update(payload).eq('id',sid));}else{check(await sb.from('marketing_toolbox_sections').insert(payload))}sectionEditing=null;await loadSections();render();flash('Subdivisión guardada y disponible en los formularios')}catch(err){flash('No se pudo guardar la subdivisión: '+err.message)}finally{btn.disabled=false}}

function isCoverAsset(f){return String(f.object_path||'').includes('/covers/')}
function getSavedCovers(x){if(!x)return [];let rows=files.filter(f=>f.item_id===x.id&&isCoverAsset(f)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)).map(f=>({id:f.id,path:f.object_path,name:f.file_name}));if(x.cover_path&&!rows.some(f=>f.path===x.cover_path))rows.unshift({id:null,path:x.cover_path,name:'Portada anterior'});return rows}
function initCoverSlides(x){releaseCovers();removedCoverSlides=[];coverSlides=getSavedCovers(x).map((g,i)=>({...g,key:crypto.randomUUID(),primary:g.path===x.cover_path||(!x.cover_path&&i===0),file:null,localUrl:null}));}
function releaseCovers(){coverSlides.forEach(g=>{if(g.localUrl)URL.revokeObjectURL(g.localUrl)});coverSlides=[]}
function addCoverFiles(inputFiles){let count=0;for(const f of Array.from(inputFiles||[])){if(!['image/png','image/jpeg'].includes(f.type)){flash('Solo se admiten imágenes JPG y PNG');continue}if(f.size>5*1024*1024){flash('La imagen '+f.name+' supera 5 MB');continue}coverSlides.push({key:crypto.randomUUID(),id:null,path:null,name:f.name,file:f,localUrl:URL.createObjectURL(f),primary:coverSlides.length===0});count++}if(count)renderCoverEditor()}
function coverCarouselHtml(gallery){return `<div class="asset-carousel cover-public"><div class="asset-stage"><div class="asset-track">${gallery.map((g,i)=>`<div class="asset-slide cover-slide" ${g.path?`data-preview-path="${esc(g.path)}"`:''}><span class="asset-icon">▣</span></div>`).join('')}</div></div>${gallery.length>1?`<div class="asset-nav"><button type="button" data-act="slide" data-dir="-1">←</button><span class="carousel-count">1 / ${gallery.length}</span><button type="button" data-act="slide" data-dir="1">→</button></div>`:''}</div>`}
function renderCoverEditor(){const el=id('cover-editor');if(!el)return;el.innerHTML=coverSlides.length?coverSlides.map((g,i)=>`<div class="cover-edit-card ${g.primary?'selected':''}" draggable="true" data-cover-index="${i}"><div class="cover-edit-image" ${g.path?`data-cover-thumbnail="${esc(g.path)}"`:''}>${g.localUrl?`<img src="${esc(g.localUrl)}" alt="Imagen de la galería">`:'▣'}</div><div class="cover-edit-data"><span>${i+1} de ${coverSlides.length}${g.primary?' · PORTADA PRINCIPAL':''}</span><div class="cover-actions"><button class="btn ${g.primary?'primary':''}" type="button" data-act="primary-cover" data-value="${i}">${g.primary?'✓ Portada':'Elegir portada'}</button><button class="btn" type="button" data-act="shift-cover" data-value="${i}" data-dir="-1" ${i===0?'disabled':''}>←</button><button class="btn" type="button" data-act="shift-cover" data-value="${i}" data-dir="1" ${i===coverSlides.length-1?'disabled':''}>→</button><button class="btn danger" type="button" data-act="remove-cover" data-value="${i}">Quitar</button></div></div></div>`).join(''):'<div class="empty">Todavía no hay imágenes. Sube una o varias para crear el carrusel.</div>';let feedback=id('cover-feedback');if(feedback)feedback.textContent=`${coverSlides.length} imágenes · la imagen marcada será la portada de las tarjetas del directorio.`;el.querySelectorAll('[data-cover-thumbnail]').forEach(async node=>{try{let url=await signed(node.dataset.coverThumbnail);if(el.contains(node)){let img=document.createElement('img');img.src=url;img.alt='Imagen del carrusel';node.replaceChildren(img)}}catch(err){console.warn(err)}})}
function moveCover(from,to){if(from<0||to<0||from>=coverSlides.length||to>=coverSlides.length||from===to)return;coverSlides.splice(to,0,coverSlides.splice(from,1)[0]);renderCoverEditor()}
function formHtml(html){let x=editing?items.find(i=>i.id===editing):null;let existingLinks=x?links.filter(a=>a.item_id===x.id):[];let existingFiles=x?files.filter(a=>a.item_id===x.id&&!isCoverAsset(a)):[];initCoverSlides(x);html+=`<div class="admin-row"><h2>${x?'Editar':'Nuevo'} contenido</h2><button class="btn" data-act="admin">Volver a gestionar</button></div><form class="panel fields" id="item-form"><div class="field"><label>Categoría</label><select name="category" id="category">${Object.entries(CATS).map(([v,l])=>`<option value="${v}" ${x?.category===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field" id="subsection-wrap"><label>Subdivisión (opcional)</label><select name="section_id" id="section-id"></select><small class="section-picker-help" id="section-picker-help"></small></div><div class="field" id="type-wrap"><label>Tipo de ficha</label><select name="sheet_type">${Object.entries(TYPES).map(([v,l])=>`<option value="${v}" ${x?.sheet_type===v?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Año</label><input name="year" type="number" min="2020" max="2100" value="${x?.year||new Date().getFullYear()}" required></div><input type="hidden" name="brand" value="${esc(x?.brand||'GENERAL')}"><div class="field full"><label>Título *</label><input name="title" value="${esc(x?.title||'')}" required maxlength="180"></div><div class="field full"><label>Galería de imágenes y portada (JPG/PNG, máximo 5 MB por imagen)</label><div class="dropzone" tabindex="0" role="button" aria-label="Añadir imágenes al carrusel"><span class="drop-icon">↥</span><strong>Arrastra varias imágenes aquí o haz clic para seleccionarlas</strong><small>JPG y PNG · selección múltiple · 5 MB por imagen</small><input type="file" id="covers-input" multiple accept="image/png,image/jpeg"></div><small id="cover-feedback">Ordena las imágenes arrastrando las tarjetas o usando las flechas. Marca una como portada principal.</small><div id="cover-editor" class="cover-editor"></div></div><div class="field full"><label>Texto explicativo</label><textarea name="description">${esc(x?.description||'')}</textarea></div><div class="field full"><label>Enlaces (nombre + URL)</label><div id="links-editor"></div><button class="btn" data-act="addlink" type="button">+ Añadir enlace</button></div><div class="field full"><label>Documentos adjuntos</label><div id="existing-files"></div><div class="dropzone" tabindex="0" role="button" aria-label="Elegir o arrastrar archivos"><span class="drop-icon">↥</span><strong>Arrastra varios archivos aquí o haz clic para seleccionarlos</strong><small>PDF, imágenes, Word, Excel, PowerPoint, SVG, ZIP · selección múltiple</small><input type="file" id="files-input" multiple accept=".pdf,.docx,.xlsx,.svg,.jpg,.jpeg,.png,.webp,.zip,.doc,.xls,.pptx,.ppt"></div><div id="file-feedback" class="file-feedback"></div><div id="pending-files" class="asset-list"></div><div id="pending-carousel"></div></div><div class="field"><label>Estado</label><select name="status" ${worker?'disabled':''}><option value="draft" ${x?.status!=='published'?'selected':''}>Borrador</option><option value="published" ${x?.status==='published'?'selected':''}>Publicado</option></select></div><div class="field"><label>Autor (automático)</label><input value="${esc(x?.author_email||user.email)}" disabled></div><div class="field full"><button type="submit" class="btn primary">${x?'GUARDAR CAMBIOS':'CREAR CONTENIDO'}</button><span id="save-msg"></span></div></form>`;main.innerHTML=html;existingLinks.forEach(l=>addLink(l.label,l.url));if(!existingLinks.length)addLink();let wrap=id('existing-files');wrap.innerHTML=(existingFiles.length?'<label>ARCHIVOS YA GUARDADOS</label>'+carouselHtml(existingFiles,'existing'):'')+existingFiles.map(f=>`<div class="row-repeat"><span style="flex:1">${esc(f.file_name)}</span><button type="button" data-act="removefile" data-value="${f.id}">Eliminar archivo</button></div>`).join('');id('section-id').dataset.initial=x?.section_id||'';adaptForm();setupDropzones();renderPending();renderCoverEditor();fillPreviews()}
function addLink(l='',u=''){let div=document.createElement('div');div.className='row-repeat';div.innerHTML=`<input class="in-label" aria-label="Nombre del enlace" placeholder="Nombre" value="${esc(l)}"><input class="in-url" aria-label="URL" type="url" placeholder="https://..." value="${esc(u)}"><button type="button" aria-label="Eliminar enlace">×</button>`;div.querySelector('button').onclick=()=>div.remove();id('links-editor').appendChild(div)}
function adaptForm(){const cat=id('category')?.value;id('type-wrap')?.classList.toggle('hidden',cat!=='fichas');const sel=id('section-id');if(!sel)return;const existing=sel.value||sel.dataset.initial||'';const available=sectionsFor(cat);sel.innerHTML=sectionOptionsHtml(cat,existing);if(existing&&available.some(x=>x.id===existing))sel.value=existing;else sel.value='';sel.dataset.initial='';const msg=id('section-picker-help');if(msg)msg.innerHTML=sectionsReady?(available.length?`${available.length} subdivisión(es) disponibles. Se mostrarán automáticamente al navegar.`:'Sin subdivisiones adicionales. Puedes crear una en Administración → Subdivisiones.'):'<span class="error">Pendiente de instalar SQL V3.3. Los recursos anteriores siguen disponibles.</span>';sel.disabled=!sectionsReady;}

async function saveItem(e){e.preventDefault();let form=e.target,b=form.querySelector('[type=submit]');b.disabled=true;id('save-msg').textContent='Guardando…';let saved=null;try{let d=new FormData(form);let category=d.get('category'),current=editing?items.find(x=>x.id===editing):null,brand=current?.brand||'GENERAL',sub=current?.subcategory||null;let sectionId=String(d.get('section_id')||'');if(sectionId&&(!sectionsReady||!sectionsFor(category).some(s=>s.id===sectionId)))throw Error('Selecciona una subdivisión válida de esta categoría');let body={section_id:sectionId||null,category,sheet_type:category==='fichas'?d.get('sheet_type'):null,year:Number(d.get('year')),brand,subcategory:sub,title:String(d.get('title')).trim(),description:String(d.get('description')||''),status:d.get('status')};if(!body.title)throw Error('Indica un título');if(worker){body.status='draft';body.created_by_user_id=user.id;body.author_email=user.email;}if(editing){saved=check(await sb.from('marketing_toolbox_items').update(body).eq('id',editing).select().single())}else{saved=check(await sb.from('marketing_toolbox_items').insert(body).select().single())}
if(worker){ await saveWorkerFilesAndLinks(saved); await reload();releasePending();releaseCovers();flash('Recurso enviado como borrador');navigate([]);return;}
// Guardar galería ordenada, con una única portada principal.
let previousCovers=files.filter(f=>f.item_id===saved.id&&isCoverAsset(f));
for(let i=0;i<coverSlides.length;i++){let g=coverSlides[i];if(g.file){const path=`${saved.id}/covers/${crypto.randomUUID()}-${g.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;check(await sb.storage.from('marketing-toolbox').upload(path,g.file,{contentType:g.file.type}));g.path=path;const inserted=check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:g.name,object_path:path,file_type:g.file.type,file_size:g.file.size,sort_order:i}).select().single());g.id=inserted.id}else if(g.id){check(await sb.from('marketing_toolbox_files').update({sort_order:i}).eq('id',g.id))}else if(g.path){const record=check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:g.name,object_path:g.path,file_type:'image/jpeg',file_size:0,sort_order:i}).select().single());g.id=record.id}}
const mainCover=coverSlides.find(g=>g.primary)||coverSlides[0]||null;
check(await sb.from('marketing_toolbox_items').update({cover_path:mainCover?.path||null}).eq('id',saved.id));
for(const removed of removedCoverSlides){if(removed.id)check(await sb.from('marketing_toolbox_files').delete().eq('id',removed.id));if(removed.path&&!coverSlides.some(g=>g.path===removed.path))check(await sb.storage.from('marketing-toolbox').remove([removed.path]))}
const existing=links.filter(l=>l.item_id===saved.id);for(let l of existing)check(await sb.from('marketing_toolbox_links').delete().eq('id',l.id));const values=[...id('links-editor').querySelectorAll('.row-repeat')].map((r,i)=>({item_id:saved.id,label:r.querySelector('.in-label').value.trim(),url:r.querySelector('.in-url').value.trim(),sort_order:i})).filter(v=>v.label&&v.url);if(values.length)check(await sb.from('marketing_toolbox_links').insert(values));const docs=uploadFiles.map(x=>x.file);const startingOrder=files.filter(f=>f.item_id===saved.id).length;for(const [index,file] of docs.entries()){const path=`${saved.id}/files/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;check(await sb.storage.from('marketing-toolbox').upload(path,file,{contentType:file.type||'application/octet-stream'}));check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:file.name,object_path:path,file_type:file.type,file_size:file.size,sort_order:startingOrder+index}))}
await reload();releasePending();releaseCovers();flash('Contenido guardado correctamente');navigate(['admin']);}catch(err){id('save-msg').textContent=err.message;flash('Error: '+err.message);if(saved)await reload()}finally{b.disabled=false}}
async function saveWorkerFilesAndLinks(saved){
  const bucket=sb.storage.from('marketing-toolbox');
  for(let i=0;i<coverSlides.length;i++){
    const c=coverSlides[i];if(!c.file)continue;
    const path=`${saved.id}/covers/${crypto.randomUUID()}-${c.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
    check(await bucket.upload(path,c.file,{contentType:c.file.type}));
    check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:c.name,object_path:path,file_type:c.file.type,file_size:c.file.size,sort_order:i}));
  }
  const values=[...id('links-editor').querySelectorAll('.row-repeat')].map((r,i)=>({item_id:saved.id,label:r.querySelector('.in-label').value.trim(),url:r.querySelector('.in-url').value.trim(),sort_order:i})).filter(v=>v.label&&v.url);
  if(values.length)check(await sb.from('marketing_toolbox_links').insert(values));
  for(const [index,file] of uploadFiles.map(x=>x.file).entries()){
    const path=`${saved.id}/files/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9_.-]/g,'_')}`;
    check(await bucket.upload(path,file,{contentType:file.type||'application/octet-stream'}));
    check(await sb.from('marketing_toolbox_files').insert({item_id:saved.id,file_name:file.name,object_path:path,file_type:file.type,file_size:file.size,sort_order:index}));
  }
}
async function doDownload(fileid){let f=files.find(x=>x.id===fileid);if(!f)return;try{const blob=check(await sb.storage.from('marketing-toolbox').download(f.object_path));const href=URL.createObjectURL(blob);let a=document.createElement('a');a.href=href;a.download=f.file_name;a.click();setTimeout(()=>URL.revokeObjectURL(href),15000)}catch(e){flash(e.message)}}
async function deleteItem(itemid){if(!confirm('¿Eliminar este contenido y sus archivos? Esta acción no se puede deshacer.'))return;try{let paths=files.filter(f=>f.item_id===itemid).map(x=>x.object_path);let cover=items.find(x=>x.id===itemid)?.cover_path;if(cover&&!paths.includes(cover))paths.push(cover);if(paths.length)check(await sb.storage.from('marketing-toolbox').remove(paths));check(await sb.from('marketing_toolbox_items').delete().eq('id',itemid));await reload();navigate(['admin']);flash('Contenido eliminado')}catch(err){flash(err.message)}}
async function removeFile(fid){if(!confirm('¿Eliminar este archivo adjunto?'))return;let f=files.find(x=>x.id===fid);if(!f)return;try{check(await sb.storage.from('marketing-toolbox').remove([f.object_path]));check(await sb.from('marketing_toolbox_files').delete().eq('id',fid));await reload();editing=f.item_id;render()}catch(e){flash(e.message)}}
main.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.value;try{if(a==='move-category'){let ordered=orderedCategories(),from=ordered.indexOf(v),to=from+Number(b.dataset.dir);if(from>=0&&to>=0&&to<ordered.length){ordered.splice(to,0,ordered.splice(from,1)[0]);await saveCategoryOrder(ordered)}}if(a==='crumb')navigate(Number(v)<0?[]:route.slice(0,Number(v)+1));if(a==='go-route')navigate(v?v.split('/').map(decodeURIComponent):[]);if(a==='back')navigate(backRoute());if(a==='pick')navigate([...route,v]);if(a==='open')navigate(['item',v]);if(a==='admin'){sectionEditing=null;navigate(['admin'])}if(a==='manage-sections'&&admin){sectionEditing=null;navigate(['admin','sections'])}if(a==='edit-section'&&admin){sectionEditing=v;render();id('section-form')?.scrollIntoView({behavior:'smooth',block:'center'})}if(a==='cancel-section'){sectionEditing=null;render()}if(a==='delete-section')await removeSection(v);if(a==='new'&&(admin||worker)){releasePending();editing=null;navigate(['admin','form'])}if(a==='edit'){releasePending();editing=v;navigate(['admin','form',v],{keepEditing:true})}if(a==='addlink')addLink();if(a==='download')await doDownload(v);if(a==='delete')await deleteItem(v);if(a==='removefile')await removeFile(v);if(a==='primary-cover'){coverSlides.forEach((g,i)=>g.primary=i===Number(v));renderCoverEditor()}if(a==='shift-cover')moveCover(Number(v),Number(v)+Number(b.dataset.dir));if(a==='remove-cover'){let g=coverSlides.splice(Number(v),1)[0];if(g){if(g.path)removedCoverSlides.push(g);if(g.localUrl)URL.revokeObjectURL(g.localUrl);if(g.primary&&coverSlides.length)coverSlides[0].primary=true}renderCoverEditor()}if(a==='slide')stepCarousel(b);if(a==='remove-pending'){let n=Number(v);if(uploadFiles[n]?.localUrl)URL.revokeObjectURL(uploadFiles[n].localUrl);uploadFiles.splice(n,1);renderPending()}}catch(err){flash(err.message)}});
main.addEventListener('dragstart',e=>{const card=e.target.closest('.category-sort-card');if(!card||!admin||!categoryOrderReady)return;draggedCategory=card.dataset.category;card.classList.add('sort-dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedCategory)});
main.addEventListener('dragover',e=>{if(!draggedCategory)return;const card=e.target.closest('.category-sort-card');if(card){e.preventDefault();e.dataTransfer.dropEffect='move';main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.toggle('sort-over',c===card))}});
main.addEventListener('drop',e=>{if(!draggedCategory)return;const card=e.target.closest('.category-sort-card');if(!card)return;e.preventDefault();const from=draggedCategory,to=card.dataset.category;draggedCategory=null;main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.remove('sort-over','sort-dragging'));if(from===to)return;const order=orderedCategories();order.splice(order.indexOf(to),0,order.splice(order.indexOf(from),1)[0]);saveCategoryOrder(order)});
main.addEventListener('dragend',()=>{draggedCategory=null;main.querySelectorAll('.category-sort-card').forEach(c=>c.classList.remove('sort-over','sort-dragging'))});
let draggedCover=-1;main.addEventListener('dragstart',e=>{let card=e.target.closest('.cover-edit-card');if(card){draggedCover=Number(card.dataset.coverIndex);e.dataTransfer.effectAllowed='move'}});main.addEventListener('dragover',e=>{if(draggedCover>=0&&e.target.closest('.cover-edit-card'))e.preventDefault()});main.addEventListener('drop',e=>{let card=e.target.closest('.cover-edit-card');if(card&&draggedCover>=0){e.preventDefault();moveCover(draggedCover,Number(card.dataset.coverIndex));draggedCover=-1}});main.addEventListener('dragend',()=>{draggedCover=-1});
main.addEventListener('scroll',e=>{if(e.target.classList?.contains('asset-track'))updateCarousel(e.target.closest('.asset-carousel'))},true);
 main.addEventListener('input',e=>{if(e.target.id!=='tool-search-input')return;searchText=e.target.value;const show=!!searchText.trim();id('tool-browse').hidden=show;id('tool-search-results').hidden=!show;if(show){id('tool-search-results').innerHTML=searchResultsHtml();fillImages()}});
main.addEventListener('click',e=>{if(e.target.id==='tool-search-clear'){searchText='';const field=id('tool-search-input');if(field)field.value='';id('tool-search-results').hidden=true;id('tool-browse').hidden=false;field?.focus()}});
main.addEventListener('change',e=>{if(e.target.id==='category')adaptForm()});main.addEventListener('submit',e=>{if(e.target.id==='login')signIn(e);if(e.target.id==='item-form')saveItem(e);if(e.target.id==='section-form')saveSection(e)});logout.addEventListener('click',async()=>{await sb.auth.signOut();user=null;allowed=false;admin=false;items=[];links=[];files=[];route=[];renderLogin()});
window.addEventListener('popstate',()=>{if(!allowed)return;const r=location.hash.slice(1);route=r?r.split('/').map(decodeURIComponent):[];editing=route[0]==='admin'&&route[1]==='form'&&route[2]?route[2]:null;render()});
async function start(){if(!cfg?.url||!(cfg.anonKey||cfg.publishableKey)||!window.supabase){main.innerHTML='<div class="empty">Falta la conexión pública de Supabase. Comprueba supabase-config.js y la librería Supabase.</div>';return}sb=window.supabase.createClient(cfg.url,cfg.anonKey||cfg.publishableKey);let hash=location.hash.slice(1);route=hash?hash.split('/').map(decodeURIComponent):[];if(route.some(x=>x==='..'))route=[];if(route[0]&&route[0]!=='admin'&&route[0]!=='item'){route=route.slice(0,route[0]==='fichas'?4:3)};try{await initialize()}catch(err){console.error(err);main.innerHTML=`<div class="empty">No se pudo iniciar la Caja de Herramientas: ${esc(err.message)}. Comprueba la conexión o contacta con el administrador.</div>`}}start();
})();
